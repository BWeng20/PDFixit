BT-63.rules=BR-56: Ein Steuerbevollmächtigter (BG-11) braucht eine Umsatzsteuer-Identifikationsnummer (BT-63).\nBR-CO-9: Umsatzsteuer-IDs (BT-31, BT-48, BT-63) beginnen mit dem Ländercode, z. B. DE; Griechenland verwendet EL.\nBR-S-2: Hat eine Position (BT-151) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-2: Hat eine Position (BT-151) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-2: Hat eine Position (BT-151) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-AE-2: Hat eine Position (BT-151) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-IC-2: Hat eine Position (BT-151) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-G-2: Hat eine Position (BT-151) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-O-2: Hat eine Position (BT-151) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-IG-2: Hat eine Position (BT-151) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-2: Hat eine Position (BT-151) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.
