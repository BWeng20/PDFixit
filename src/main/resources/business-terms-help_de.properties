 (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-9: Für Kategorie M (IPSI, Ceuta und Melilla): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).
BT-117.name=Kategoriespezifischer Steuerbetrag
BT-117.use=Der Steuerbetrag dieser Kategorie.
BT-117.note=Steuerbasisbetrag (BT-116) mal Steuersatz (BT-119).
BT-117.rules=BR-46: Jede Umsatzsteueraufschlüsselung (BG-23) braucht den Steuerbetrag (BT-117).\nBR-CO-17: Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119) / 100, auf 2 Nachkommastellen gerundet.\nBR-S-9: Für Kategorie S (Normalsatz): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).\nBR-Z-9: Für Kategorie Z (Nullsatz) ist der Steuerbetrag (BT-117) 0.\nBR-E-9: Für Kategorie E (steuerbefreit) ist der Steuerbetrag (BT-117) 0.\nBR-AE-9: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft) ist der Steuerbetrag (BT-117) 0.\nBR-IC-9: Für Kategorie K (innergemeinschaftliche Lieferung) ist der Steuerbetrag (BT-117) 0.\nBR-G-9: Für Kategorie G (Ausfuhr aus der EU) ist der Steuerbetrag (BT-117) 0.\nBR-O-9: Für Kategorie O (nicht steuerbar) ist der Steuerbetrag (BT-117) 0.\nBR-IG-9: Für Kategorie L (IGIC, Kanarische Inseln): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).\nBR-IP-9: Für Kategorie M (IPSI, Ceuta und Melilla): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).
BT-118.name=Code der Umsatzsteuerkategorie
BT-118.use=Die Umsatzsteuerkategorie, z. B. S für den Normalsatz.
BT-118.note=S Normalsatz, Z Nullsatz, E steuerbefreit, AE Umkehrung der Steuerschuldnerschaft, K innergemeinschaftliche Lieferung, G Ausfuhr aus der EU, O nicht steuerbar, L Kanarische Inseln (IGIC), M Ceuta und Melilla (IPSI).
