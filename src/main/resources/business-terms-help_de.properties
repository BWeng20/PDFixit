nBR-E-8: Für Kategorie E (steuerbefreit): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-AE-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie AE (Umkehrung der Steuerschuldnerschaft) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie AE (BT-118).\nBR-AE-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-7: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-AE-8: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IC-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie K (innergemeinschaftliche Lieferung) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie K (BT-118).\nBR-IC-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-7: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-IC-8: Für Kategorie K (innergemeinschaftliche Lieferung): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-G-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie G (Ausfuhr aus der EU) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie G (BT-118).\nBR-G-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-7: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-G-8: Für Kategorie G (Ausfuhr aus der EU): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie O (nicht steuerbar) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie O (BT-118).\nBR-O-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-7: Bei Kategorie O (nicht steuerbar) hat der Zuschlag keinen Steuersatz (BT-103).\nBR-O-8: Für Kategorie O (nicht steuerbar): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-14: Bei Kategorie O (nicht steuerbar) müssen alle Zuschläge auf die Rechnung Kategorie O haben (BT-102).\nBR-IG-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie L (IGIC, Kanarische Inseln) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie L (BT-118).\nBR-IG-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-7: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz des Zuschlags (BT-103) 0 oder größer sein.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie M (IPSI, Ceuta und Melilla) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie M (BT-118).\nBR-IP-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-7: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz des Zuschlags (BT-103) 0 oder größer sein.\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
BT-103.name=Umsatzsteuersatz des Zuschlags auf Dokumentenebene
BT-103.use=Der Umsatzsteuersatz des Zuschlags in Prozent.
BT-103.rules=BR-S-7: Bei Kategorie S (Normalsatz) muss der Steuersatz des Zuschlags (BT-103) größer als 0 sein.\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-Z-7: Bei Kategorie Z (Nullsatz) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-E-7: Bei Kategorie E (steuerbefreit) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-AE-7: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-IC-7: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-G-7: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz des Zuschlags (BT-103) 0 sein.\nBR-O-7: Bei Kategorie O (nicht steuerbar) hat der Zuschlag keinen Steuersatz (BT-103).\nBR-IG-7: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz des Zuschlags (BT-103) 0 oder größer sein.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-7: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz des Zuschlags (BT-103) 0 oder größer sein.\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
BT-104.name=Grund für den Zuschlag auf Dokumentenebene
BT-104.use=Der Grund des Zuschlags als Text.
BT-104.rules=BR-38: Jeder Zuschlag auf die Rechnung (BG-21) braucht einen Grund, als Text (BT-104) oder Code (BT-105).\nBR-CO-6: Code (BT-105) und Text (BT-104) des Zuschlaggrunds müssen dasselbe aussagen.\nBR-CO-22: Jeder Zuschlag auf die Rechnung (BG-21) braucht einen Grund als Text (BT-104), als Code (BT-105) oder beides.
BT-105.name=Code des Grundes für den Zuschlag auf Dokumentenebene
BT-105.use=Der Grund des Zuschlags als Code.
BT-105.note=Codes aus UNTDID 7161. Code und Text (BT-104) müssen dasselbe aussagen.
BT-105.rules=BR-38: Jeder Zuschlag auf die Rechnung (BG-21) braucht einen Grund, als Text (BT-104) oder Code (BT-105).\nBR-CO-6: Code (BT-105) und Text (BT-104) des Zuschlaggrunds müssen dasselbe aussagen.\nBR-CO-22: Jeder Zuschlag auf die Rechnung (BG-21) braucht einen Grund als Text (BT-104), als Code (BT-105) oder beides.
BG-22.name=GESAMTSUMMEN AUF DOKUMENTENEBENE
BG-22.use=Die Summen der Rechnung.
BT-106.name=Summe der Nettobeträge aller Rechnungspositionen
BT-106.use=Die Summe der Nettobeträge aller Positionen.
BT-106.rules=BR-12: Die Rechnung braucht die Summe der Positionsbeträge (BT-106).\nBR-CO-10: Summe der Positionen (BT-106) = Summe aller Positionsbeträge (BT-131).
BT-107.name=Summe der Abschläge auf Dokumentenebene
BT-107.use=Die Summe aller Abschläge auf die ganze Rechnung.
BT-107.note=Abschläge einzelner Positionen stecken schon in deren Beträgen.
BT-107.rules=BR-CO-11: Summe der Abschläge (BT-107) = Summe aller Abschläge auf die Rechnung (BT-92).
BT-108.name=Summe der Zuschläge auf Dokumentenebene
BT-108.use=Die Summe aller Zuschläge auf die ganze Rechnung.
BT-108.note=Zuschläge einzelner Positionen stecken schon in deren Beträgen.
BT-108.rules=BR-CO-12: Summe der Zuschläge (BT-108) = Summe aller Zuschläge auf die Rechnung (BT-99).
BT-109.name=Rechnungsgesamtbetrag ohne Umsatzsteuer
BT-109.use=Die Gesamtsumme der Rechnung ohne Umsatzsteuer.
BT-109.note=Summe der Positionen minus Abschläge plus Zuschläge auf die ganze Rechnung.
BT-109.rules=BR-13: Die Rechnung braucht die Gesamtsumme ohne Umsatzsteuer (BT-109).\nBR-CO-13: Summe ohne Umsatzsteuer (BT-109) = Summe der Positionen (BT-131) − Abschläge (BT-107) + Zuschläge (BT-108).
BT-110.name=Gesamtbetrag der Rechnungsumsatzsteuer
BT-110.use=Die gesamte Umsatzsteuer der Rechnung.
BT-110.note=Die Summe der Steuerbeträge aller Umsatzsteuerkategorien.
BT-110.rules=BR-CO-14: Gesamte Umsatzsteuer (BT-110) = Summe der Steuerbeträge aller Kategorien (BT-117).
BT-111.name=Steuergesamtbetrag in Buchungswährung
BT-111.use=Die gesamte Umsatzsteuer in der Buchungswährung (BT-6).
BT-111.note=Nur wenn die Buchungswährung von der Rechnungswährung abweicht. Zählt nicht zu den Summen der Rechnung.
BT-111.rules=BR-53: Ist eine Buchungswährung angegeben (BT-6), auch die Umsatzsteuer in dieser Währung angeben (BT-111).
BT-112.name=Rechnungsgesamtbetrag einschließlich Umsatzsteuer
BT-112.use=Die Gesamtsumme der Rechnung mit Umsatzsteuer.
BT-112.note=Summe ohne Umsatzsteuer plus gesamte Umsatzsteuer.
BT-112.rules=BR-14: Die Rechnung braucht die Gesamtsumme mit Umsatzsteuer (BT-112).\nBR-CO-15: Summe mit Umsatzsteuer (BT-112) = Summe ohne Umsatzsteuer (BT-109) + gesamte Umsatzsteuer (BT-110).
BT-113.name=Vorauszahlungsbetrag
BT-113.use=Der bereits im Voraus gezahlte Betrag.
BT-113.note=Er wird von der Summe mit Umsatzsteuer abgezogen, um den zu zahlenden Betrag zu erhalten.
BT-114.name=Rundungsbetrag
BT-114.use=Ein Betrag, der zum Runden des zu zahlenden Betrags addiert wird.
BT-115.name=Fälliger Zahlungsbetrag
BT-115.use=Der noch zu zahlende Betrag.
BT-115.note=Summe mit Umsatzsteuer minus bereits gezahlter Betrag. Null, wenn alles bezahlt ist; negativ, wenn Sie dem Käufer Geld schulden.
BT-115.rules=BR-15: Die Rechnung braucht den zu zahlenden Betrag (BT-115).\nBR-CO-16: Zu zahlender Betrag (BT-115) = Summe mit Umsatzsteuer (BT-112) − bereits gezahlt (BT-113) + Rundung (BT-114).
BG-23.name=UMSATZSTEUERAUFSCHLÜSSELUNG
BG-23.use=Die Umsatzsteuer aufgeschlüsselt nach Kategorie, Satz und Befreiungsgrund: ein Eintrag je Kategorie und Satz.
BG-23.rules=BR-CO-18: Die Rechnung braucht mindestens eine Umsatzsteueraufschlüsselung (BG-23).\nBR-S-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie S (Normalsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie S (BT-118).\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-S-9: Für Kategorie S (Normalsatz): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).\nBR-S-10: Kategorie S (Normalsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-Z-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie Z (Nullsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie Z (BT-118).\nBR-Z-8: Für Kategorie Z (Nullsatz): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-Z-9: Für Kategorie Z (Nullsatz) ist der Steuerbetrag (BT-117) 0.\nBR-Z-10: Kategorie Z (Nullsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-E-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie E (steuerbefreit) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie E (BT-118).\nBR-E-8: Für Kategorie E (steuerbefreit): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-E-9: Für Kategorie E (steuerbefreit) ist der Steuerbetrag (BT-117) 0.\nBR-E-10: Kategorie E (steuerbefreit) braucht einen Befreiungsgrund, als Text (BT-120) oder Code (BT-121).\nBR-AE-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie AE (Umkehrung der Steuerschuldnerschaft) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie AE (BT-118).\nBR-AE-8: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-AE-9: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft) ist der Steuerbetrag (BT-117) 0.\nBR-AE-10: Kategorie AE (Umkehrung der Steuerschuldnerschaft) braucht den Befreiungsgrund „Umkehrung der Steuerschuldnerschaft“, als Code (BT-121) oder Text (BT-120).\nBR-IC-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie K (innergemeinschaftliche Lieferung) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie K (BT-118).\nBR-IC-8: Für Kategorie K (innergemeinschaftliche Lieferung): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IC-9: Für Kategorie K (innergemeinschaftliche Lieferung) ist der Steuerbetrag (BT-117) 0.\nBR-IC-10: Kategorie K (innergemeinschaftliche Lieferung) braucht den Befreiungsgrund „innergemeinschaftliche Lieferung“, als Code (BT-121) oder Text (BT-120).\nBR-IC-11: Bei innergemeinschaftlicher Lieferung (K) das Lieferdatum (BT-72) oder den Rechnungszeitraum (BG-14) angeben.\nBR-IC-12: Bei innergemeinschaftlicher Lieferung (K) das Land der Lieferanschrift angeben (BT-80).\nBR-G-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie G (Ausfuhr aus der EU) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie G (BT-118).\nBR-G-8: Für Kategorie G (Ausfuhr aus der EU): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-G-9: Für Kategorie G (Ausfuhr aus der EU) ist der Steuerbetrag (BT-117) 0.\nBR-G-10: Kategorie G (Ausfuhr aus der EU) braucht den Befreiungsgrund „Ausfuhr aus der EU“, als Code (BT-121) oder Text (BT-120).\nBR-O-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie O (nicht steuerbar) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie O (BT-118).\nBR-O-8: Für Kategorie O (nicht steuerbar): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-9: Für Kategorie O (nicht steuerbar) ist der Steuerbetrag (BT-117) 0.\nBR-O-10: Kategorie O (nicht steuerbar) braucht den Befreiungsgrund „nicht steuerbar“, als Code (BT-121) oder Text (BT-120).\nBR-O-11: Bei Kategorie O (nicht steuerbar) hat die Rechnung keine weitere Umsatzsteueraufschlüsselung (BG-23).\nBR-O-12: Bei Kategorie O (nicht steuerbar) müssen alle Positionen Kategorie O haben (BT-151).\nBR-O-13: Bei Kategorie O (nicht steuerbar) müssen alle Abschläge auf die Rechnung Kategorie O haben (BT-95).\nBR-O-14: Bei Kategorie O (nicht steuerbar) müssen alle Zuschläge auf die Rechnung Kategorie O haben (BT-102).\nBR-IG-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie L (IGIC, Kanarische Inseln) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie L (BT-118).\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IG-9: Für Kategorie L (IGIC, Kanarische Inseln): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).\nBR-IG-10: Kategorie L (IGIC, Kanarische Inseln) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-IP-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie M (IPSI, Ceuta und Melilla) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie M (BT-118).\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-9: Für Kategorie M (IPSI, Ceuta und Melilla): Steuerbetrag (BT-117) = Steuerbasisbetrag (BT-116) × Steuersatz (BT-119).\nBR-IP-10: Kategorie M (IPSI, Ceuta und Melilla) hat keinen Befreiungsgrund (BT-120, BT-121).
