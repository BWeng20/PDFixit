BG-20.rules=BR-S-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie S (Normalsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie S (BT-118).\nBR-S-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-6: Bei Kategorie S (Normalsatz) muss der Steuersatz des Abschlags (BT-96) größer als 0 sein.\nBR-Z-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie Z (Nullsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie Z (BT-118).\nBR-Z-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-6: Bei Kategorie Z (Nullsatz) muss der Steuersatz des Abschlags (BT-96) 0 sein.\nBR-E-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie E (steuerbefreit) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie E (BT-118).\nBR-E-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-6: Bei Kategorie E (steuerbefreit) muss der Steuersatz des Abschlags (BT-96) 0 sein.\nBR-AE-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie AE (Umkehrung der Steuerschuldnerschaft) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie AE (BT-118).\nBR-AE-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-6: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz des Abschlags (BT-96) 0 sein.\nBR-IC-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie K (innergemeinschaftliche Lieferung) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie K (BT-118).\nBR-IC-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-6: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz des Abschlags (BT-96) 0 sein.\nBR-G-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie G (Ausfuhr aus der EU) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie G (BT-118).\nBR-G-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-6: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz des Abschlags (BT-96) 0 sein.\nBR-O-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie O (nicht steuerbar) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie O (BT-118).\nBR-O-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-6: Bei Kategorie O (nicht steuerbar) hat der Abschlag keinen Steuersatz (BT-96).\nBR-O-13: Bei Kategorie O (nicht steuerbar) müssen alle Abschläge auf die Rechnung Kategorie O haben (BT-95).\nBR-IG-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie L (IGIC, Kanarische Inseln) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie L (BT-118).\nBR-IG-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-6: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz des Abschlags (BT-96) 0 oder größer sein.\nBR-IP-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie M (IPSI, Ceuta und Melilla) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie M (BT-118).\nBR-IP-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-6: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz des Abschlags (BT-96) 0 oder größer sein.
BT-92.name=Betrag des Abschlags auf Dokumentenebene
BT-92.use=Der Betrag des Abschlags ohne Umsatzsteuer.
BT-92.rules=BR-31: Jeder Abschlag auf die Rechnung (BG-20) braucht einen Betrag (BT-92).\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-Z-8: Für Kategorie Z (Nullsatz): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-E-8: Für Kategorie E (steuerbefreit): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-AE-8: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IC-8: Für Kategorie K (innergemeinschaftliche Lieferung): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-G-8: Für Kategorie G (Ausfuhr aus der EU): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-8: Für Kategorie O (nicht steuerbar): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
BT-93.name=Grundbetrag des Abschlags auf Dokumentenebene
BT-93.use=Der Grundbetrag, auf den sich der Prozentsatz des Abschlags (BT-94) bezieht.
BT-94.name=prozentualer Abschlag auf Dokumentenebene
