BT-97.rules=BR-33: Jeder Abschlag auf die Rechnung (BG-20) braucht einen Grund, als Text (BT-97) oder Code (BT-98).\nBR-CO-5: Code (BT-98) und Text (BT-97) des Abschlaggrunds müssen dasselbe aussagen.\nBR-CO-21: Jeder Abschlag auf die Rechnung (BG-20) braucht einen Grund als Text (BT-97), als Code (BT-98) oder beides.
