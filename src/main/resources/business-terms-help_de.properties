BT-152.rules=BR-S-5: Bei Kategorie S (Normalsatz) muss der Steuersatz der Position (BT-152) größer als 0 sein.\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-Z-5: Bei Kategorie Z (Nullsatz) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-E-5: Bei Kategorie E (steuerbefreit) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-AE-5: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-IC-5: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-G-5: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-O-5: Bei Kategorie O (nicht steuerbar) hat die Position keinen Steuersatz (BT-152).\nBR-IG-5: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz der Position (BT-152) 0 oder größer sein.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-5: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz der Position (BT-152) 0 oder größer sein.\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
