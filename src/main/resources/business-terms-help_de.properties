# Deutsche Hilfetexte der Fachbegriffe: Name, Beschreibung ("use"), Hinweis ("note") und die Geschäftsregeln,
# als kurze Hinweise nach der Norm umformuliert (nicht ihr Wortlaut). Alle anderen Angaben kommen aus
# business-terms-help.properties.
# Quelle: DIN EN 16931-1:2020-12 (Deutsche Fassung EN 16931-1:2017+A1:2019+AC:2020). Implementierung des
# semantischen Datenmodells der EN 16931-1; Vervielfältigung mit Genehmigung von CEN und DIN als
# Urheberrechtsinhaber. CEN und DIN übernehmen keine Haftung für Inhalt und Implementierung dieser Anwendung.
# Erzeugt von test/business-terms/en16931.py.

BT-1.name=Rechnungsnummer
BT-1.use=Die Nummer der Rechnung.
BT-1.note=Fortlaufende Nummer, die nur einmal vergeben wird. Buchstaben sind erlaubt, z. B. „2026-0042“.
BT-1.rules=BR-2: Die Rechnung braucht eine Rechnungsnummer (BT-1).
BT-2.name=Rechnungsdatum
BT-2.use=Das Datum, an dem die Rechnung ausgestellt wird.
BT-2.rules=BR-3: Die Rechnung braucht ein Rechnungsdatum (BT-2).
BT-3.name=Code für den Rechnungstyp
BT-3.use=Die Art der Rechnung, z. B. 380 für eine Rechnung oder 381 für eine Gutschrift.
BT-3.note=Einen Code der Liste UNTDID 1001 wählen. Meist 380 (Handelsrechnung).
BT-3.rules=BR-4: Die Rechnung braucht einen Rechnungstyp (BT-3).
BT-5.name=Code für die Rechnungswährung
BT-5.use=Die Währung aller Beträge der Rechnung, z. B. EUR.
BT-5.note=Eine Rechnung hat nur eine Währung. Nur die Umsatzsteuer in Buchungswährung (BT-111) darf eine andere haben.
BT-5.rules=BR-5: Die Rechnung braucht eine Währung (BT-5).
BT-6.name=Code für die Währung der Umsatzsteuerbuchung
BT-6.use=Die Währung, in der die Umsatzsteuer im Land des Verkäufers gebucht wird, falls sie von der Rechnungswährung abweicht.
BT-6.note=Nur nötig, wenn die Umsatzsteuer in einer anderen Währung gemeldet werden muss. Dann auch den Steuerbetrag in dieser Währung angeben (BT-111).
BT-7.name=Datum der Steuerfälligkeit
BT-7.use=Das Datum, an dem die Umsatzsteuer entsteht, falls es vom Rechnungsdatum abweicht.
BT-7.note=Meist das Datum der Lieferung oder der abgeschlossenen Leistung. Entweder dieses Datum oder seinen Code (BT-8) angeben, nicht beides.
BT-7.rules=BR-CO-3: Entweder das Steuerdatum (BT-7) oder seinen Code (BT-8) angeben, nicht beides.
BT-8.name=Code für das Datum der Steuerfälligkeit
BT-8.use=Gibt als Code an, zu welchem Datum die Umsatzsteuer entsteht, wenn das Datum selbst noch nicht bekannt ist.
BT-8.note=Möglich: Rechnungsdatum, Lieferdatum oder Zahlungsdatum (Codes aus UNTDID 2005). Entweder diesen Code oder das Datum (BT-7) angeben, nicht beides.
BT-8.rules=BR-CO-3: Entweder das Steuerdatum (BT-7) oder seinen Code (BT-8) angeben, nicht beides.
BT-9.name=Fälligkeitsdatum der Zahlung
BT-9.use=Das Datum, bis zu dem die Rechnung bezahlt sein soll.
BT-9.note=Bei Teilzahlungen das erste Fälligkeitsdatum. Kompliziertere Bedingungen können in den Zahlungsbedingungen (BT-20) beschrieben werden.
BT-9.rules=BR-CO-25: Ist ein Betrag zu zahlen (BT-115), ein Fälligkeitsdatum (BT-9) oder Zahlungsbedingungen (BT-20) angeben.
BT-10.name=Referenz des Käufers
BT-10.use=Eine Referenz, die der Käufer vorgegeben hat, damit die Rechnung intern richtig ankommt.
BT-10.note=Z. B. Abteilung, Ansprechpartner oder Projektcode. Bei öffentlichen Auftraggebern in Deutschland steht hier die Leitweg-ID.
BT-11.name=Projektreferenz
BT-11.use=Das Projekt, zu dem die Rechnung gehört.
BT-12.name=Vertragsreferenz
BT-12.use=Die Nummer des Vertrags.
BT-12.note=Sollte innerhalb der Geschäftsbeziehung mit dem Käufer eindeutig sein.
BT-13.name=Bestellreferenz
BT-13.use=Die Bestellnummer des Käufers.
BT-14.name=Verkaufsauftragsreferenz
BT-14.use=Ihre eigene Auftragsnummer.
BT-15.name=Referenz auf die Wareneingangsmeldung
BT-15.use=Die Nummer der Wareneingangsmeldung des Käufers.
BT-16.name=Lieferavisreferenz
BT-16.use=Die Nummer des Lieferavis (Lieferscheins).
BT-17.name=Ausschreibungs- oder Losreferenz
BT-17.use=Die Ausschreibung oder das Los, auf das sich die Rechnung bezieht.
BT-17.note=In manchen Ländern bei öffentlichen Aufträgen Pflicht.
BT-18.name=Objektkennung
BT-18.use=Das Objekt, um das es in der Rechnung geht.
BT-18.note=Z. B. Abonnement-, Telefon- oder Zählernummer, ein Fahrzeug oder eine Person.
BT-18-1.name=Kennung des Schemas
BT-18-1.use=Gibt an, welche Art von Kennung die Objektkennung (BT-18) ist.
BT-18-1.note=Nur nötig, wenn das für den Empfänger nicht klar ist. Einen Code aus UNTDID 1153 wählen.
BT-19.name=Buchungsreferenz des Käufers
BT-19.use=Wo der Käufer die Rechnung bucht, z. B. Kostenstelle oder Konto.
BT-20.name=Zahlungsbedingungen
BT-20.use=Die Zahlungsbedingungen als Text, z. B. Skonto oder Verzugsregeln.
BT-20.note=Darf mehrere Zeilen und Bedingungen enthalten.
BT-20.rules=BR-CO-25: Ist ein Betrag zu zahlen (BT-115), ein Fälligkeitsdatum (BT-9) oder Zahlungsbedingungen (BT-20) angeben.
BG-1.name=FREITEXT ZUR RECHNUNG
BG-1.use=Freitexte zur ganzen Rechnung, jeweils mit optionalem Thema.
BT-21.name=Code zur Qualifizierung des Freitextes zur Rechnung
BT-21.use=Das Thema des Freitexts (BT-22) als Code.
BT-21.note=Einen Code aus UNTDID 4451 wählen.
BT-22.name=Freitext zur Rechnung
BT-22.use=Ein Freitext zur ganzen Rechnung.
BT-22.note=Z. B. der Grund einer Korrektur oder ein Abtretungshinweis, wenn die Rechnung an ein Factoring-Unternehmen verkauft wurde.
BG-2.name=PROZESSSTEUERUNG
BG-2.use=Angaben zum Geschäftsprozess und zu den Regeln, nach denen die Rechnung aufgebaut ist.
BT-23.name=Geschäftsprozesstyp
BT-23.use=Der Geschäftsprozess, zu dem die Rechnung gehört, damit der Käufer sie richtig verarbeitet.
BT-23.note=Der Käufer gibt vor, was hier steht.
BT-24.name=Spezifikationskennung
BT-24.use=Die Spezifikation, nach der die Rechnung aufgebaut ist, z. B. das Profil von ZUGFeRD / Factur-X oder XRechnung.
BT-24.note=Wird vom Programm nach dem gewählten Profil gesetzt. Für die EN 16931 lautet sie „urn:cen.eu:en16931:2017“.
BT-24.rules=BR-1: Die Rechnung braucht eine Spezifikationskennung (BT-24).
BG-3.name=REFERENZ AUF DIE VORAUSGEGANGENE RECHNUNG
BG-3.use=Verweise auf frühere Rechnungen.
BG-3.note=Verwenden, wenn eine Rechnung korrigiert wird oder eine Schlussrechnung auf Teil- oder Vorauszahlungsrechnungen verweist.
BT-25.name=Referenz auf die vorausgegangene Rechnung
BT-25.use=Die Nummer der früheren Rechnung.
BT-25.rules=BR-55: Jeder Verweis auf eine frühere Rechnung (BG-3) braucht deren Nummer (BT-25).
BT-26.name=Rechnungsdatum der vorausgegangenen Rechnung
BT-26.use=Das Datum der früheren Rechnung.
BT-26.note=Angeben, wenn die Nummer allein nicht eindeutig ist.
BG-4.name=VERKÄUFER
BG-4.use=Angaben zum Verkäufer (Ihnen).
BT-27.name=Name des Verkäufers
BT-27.use=Ihr vollständiger offizieller Name, wie eingetragen (z. B. im Handelsregister), oder Ihr eigener Name.
BT-27.rules=BR-6: Die Rechnung braucht den Namen des Verkäufers (BT-27).
BT-28.name=Handelsname des Verkäufers
BT-28.use=Der Name, unter dem Sie auftreten, falls er vom offiziellen Namen abweicht.
BT-28.note=Nur angeben, wenn er vom Namen des Verkäufers abweicht.
BT-29.name=Kennung des Verkäufers
BT-29.use=Eine Kennung von Ihnen als Verkäufer, z. B. GLN oder die Lieferantennummer beim Käufer.
BT-29.note=Mehrere sind möglich. Ohne Schema (BT-29-1) muss der Käufer wissen, was sie bedeutet. Mit Schema dieses aus der Liste ISO/IEC 6523 wählen.
BT-29.rules=BR-CO-26: Damit der Käufer Sie erkennt, eine Verkäuferkennung (BT-29), eine Registernummer (BT-30) oder eine Umsatzsteuer-ID (BT-31) angeben.
BT-29-1.name=Kennung des Schemas
BT-29-1.use=Die Art der Verkäuferkennung (BT-29), z. B. 0088 für eine GLN.
BT-30.name=Kennung der rechtlichen Registrierung des Verkäufers
BT-30.use=Ihre Nummer in einem amtlichen Register, z. B. die Handelsregisternummer.
BT-30.note=Ohne Schema muss der Käufer wissen, welches Register gemeint ist.
BT-30.rules=BR-CO-26: Damit der Käufer Sie erkennt, eine Verkäuferkennung (BT-29), eine Registernummer (BT-30) oder eine Umsatzsteuer-ID (BT-31) angeben.
BT-30-1.name=Kennung des Schemas
BT-30-1.use=Die Art der Registernummer (BT-30).
BT-30-1.note=Aus der Liste ISO/IEC 6523 wählen.
BT-31.name=Umsatzsteuer-Identifikationsnummer des Verkäufers
BT-31.use=Ihre Umsatzsteuer-Identifikationsnummer, z. B. DE123456789.
BT-31.note=Mit Länderkennung. Nötig, wenn Sie umsatzsteuerpflichtig sind, außer Sie haben einen Steuerbevollmächtigten.
BT-31.rules=BR-CO-9: Umsatzsteuer-IDs (BT-31, BT-48, BT-63) beginnen mit dem Ländercode, z. B. DE; Griechenland verwendet EL.\nBR-CO-26: Damit der Käufer Sie erkennt, eine Verkäuferkennung (BT-29), eine Registernummer (BT-30) oder eine Umsatzsteuer-ID (BT-31) angeben.\nBR-S-2: Hat eine Position (BT-151) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-2: Hat eine Position (BT-151) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-2: Hat eine Position (BT-151) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-AE-2: Hat eine Position (BT-151) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-IC-2: Hat eine Position (BT-151) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-G-2: Hat eine Position (BT-151) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-O-2: Hat eine Position (BT-151) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-IG-2: Hat eine Position (BT-151) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-2: Hat eine Position (BT-151) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.
BT-32.name=Steuernummer des Verkäufers
BT-32.use=Ihre Steuernummer beim Finanzamt.
BT-32.note=In manchen Ländern muss der Käufer Steuer einbehalten, wenn der Verkäufer nicht steuerlich gemeldet ist; die Angabe kann also die Zahlung beeinflussen.
BT-32.rules=BR-S-2: Hat eine Position (BT-151) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-2: Hat eine Position (BT-151) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-2: Hat eine Position (BT-151) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-AE-2: Hat eine Position (BT-151) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-IG-2: Hat eine Position (BT-151) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-2: Hat eine Position (BT-151) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-3: Hat ein Abschlag auf die Rechnung (BT-95) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-4: Hat ein Zuschlag auf die Rechnung (BT-102) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.
BT-33.name=Sonstige rechtliche Informationen des Verkäufers
BT-33.use=Weitere rechtliche Angaben zu Ihnen.
BT-33.note=Z. B. Stammkapital oder Geschäftsführer.
BT-34.name=Elektronische Adresse des Verkäufers
BT-34.use=Ihre elektronische Adresse für Antworten auf die Rechnung, z. B. eine E-Mail-Adresse.
BT-34.rules=BR-62: Ihre elektronische Adresse (BT-34) braucht ein Schema (die Art der Adresse).
BT-34-1.name=Kennung des Schemas
BT-34-1.use=Die Art Ihrer elektronischen Adresse, z. B. EM für E-Mail.
