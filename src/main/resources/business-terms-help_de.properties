BT-120.rules=BR-S-10: Kategorie S (Normalsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-Z-10: Kategorie Z (Nullsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-E-10: Kategorie E (steuerbefreit) braucht einen Befreiungsgrund, als Text (BT-120) oder Code (BT-121).\nBR-AE-10: Kategorie AE (Umkehrung der Steuerschuldnerschaft) braucht den Befreiungsgrund „Umkehrung der Steuerschuldnerschaft“, als Code (BT-121) oder Text (BT-120).\nBR-IC-10: Kategorie K (innergemeinschaftliche Lieferung) braucht den Befreiungsgrund „innergemeinschaftliche Lieferung“, als Code (BT-121) oder Text (BT-120).\nBR-G-10: Kategorie G (Ausfuhr aus der EU) braucht den Befreiungsgrund „Ausfuhr aus der EU“, als Code (BT-121) oder Text (BT-120).\nBR-O-10: Kategorie O (nicht steuerbar) braucht den Befreiungsgrund „nicht steuerbar“, als Code (BT-121) oder Text (BT-120).\nBR-IG-10: Kategorie L (IGIC, Kanarische Inseln) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-IP-10: Kategorie M (IPSI, Ceuta und Melilla) hat keinen Befreiungsgrund (BT-120, BT-121).
BT-121.name=Code für den Umsatzsteuerbefreiungsgrund
BT-121.use=Warum keine Umsatzsteuer berechnet wird, als Code.
BT-121.note=Codes aus der Liste VATEX.
BT-121.rules=BR-S-10: Kategorie S (Normalsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-Z-10: Kategorie Z (Nullsatz) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-E-10: Kategorie E (steuerbefreit) braucht einen Befreiungsgrund, als Text (BT-120) oder Code (BT-121).\nBR-AE-10: Kategorie AE (Umkehrung der Steuerschuldnerschaft) braucht den Befreiungsgrund „Umkehrung der Steuerschuldnerschaft“, als Code (BT-121) oder Text (BT-120).\nBR-IC-10: Kategorie K (innergemeinschaftliche Lieferung) braucht den Befreiungsgrund „innergemeinschaftliche Lieferung“, als Code (BT-121) oder Text (BT-120).\nBR-G-10: Kategorie G (Ausfuhr aus der EU) braucht den Befreiungsgrund „Ausfuhr aus der EU“, als Code (BT-121) oder Text (BT-120).\nBR-O-10: Kategorie O (nicht steuerbar) braucht den Befreiungsgrund „nicht steuerbar“, als Code (BT-121) oder Text (BT-120).\nBR-IG-10: Kategorie L (IGIC, Kanarische Inseln) hat keinen Befreiungsgrund (BT-120, BT-121).\nBR-IP-10: Kategorie M (IPSI, Ceuta und Melilla) hat keinen Befreiungsgrund (BT-120, BT-121).
BG-24.name=RECHNUNGSBEGRÜNDENDE UNTERLAGEN
BG-24.use=Belege zur Rechnung, z. B. ein Stundenzettel.
BG-24.note=Ein Beleg kann über seine Nummer genannt, per URL verlinkt oder angehängt werden (z. B. als PDF). Große oder vertrauliche Unterlagen besser verlinken als anhängen.
BT-122.name=Kennung der rechnungsbegründenden Unterlage
BT-122.use=Die Nummer oder Bezeichnung des Belegs.
BT-122.rules=BR-52: Jeder Beleg (BG-24) braucht eine Nummer oder Bezeichnung (BT-122).
BT-123.name=Beschreibung der rechnungsbegründenden Unterlage
BT-123.use=Eine Beschreibung des Belegs.
BT-123.note=Z. B. Stundenzettel oder Verbrauchsbericht.
BT-124.name=Bezugsort der rechnungsbgegründenden Unterlage
BT-124.use=Die Internetadresse (URL) eines externen Dokuments.
BT-124.note=Externe Dokumente gehören nicht zur Rechnung; die Rechnung muss ohne sie bearbeitet werden können. Externe Links zu öffnen, kann riskant sein.
BT-125.name=Anhangsdokument
BT-125.use=Ein an die Rechnung angehängtes Dokument.
BT-125.note=Für Unterlagen, die mit der Rechnung aufbewahrt werden sollen, z. B. für Prüfungen. Erlaubte Typen: PDF, PNG, JPEG, CSV, Excel (xlsx) und OpenDocument-Tabellen (ods).
BT-125-1.name=MIME-Code des Anhangsdokuments
BT-125-1.use=Der Dateityp (MIME-Code) des angehängten Dokuments, z. B. application/pdf.
BT-125-2.name=Dateiname des Anhangsdokuments
BT-125-2.use=Der Dateiname des angehängten Dokuments.
BG-25.name=RECHNUNGSPOSITION
BG-25.use=Eine Position der Rechnung.
BG-25.rules=BR-16: Die Rechnung braucht mindestens eine Position (BG-25).\nBR-S-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie S (Normalsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie S (BT-118).\nBR-S-2: Hat eine Position (BT-151) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-5: Bei Kategorie S (Normalsatz) muss der Steuersatz der Position (BT-152) größer als 0 sein.\nBR-Z-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie Z (Nullsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie Z (BT-118).\nBR-Z-5: Bei Kategorie Z (Nullsatz) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-E-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie E (steuerbefreit) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie E (BT-118).\nBR-E-2: Hat eine Position (BT-151) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-5: Bei Kategorie E (steuerbefreit) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-AE-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie AE (Umkehrung der Steuerschuldnerschaft) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie AE (BT-118).\nBR-AE-2: Hat eine Position (BT-151) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-5: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-IC-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie K (innergemeinschaftliche Lieferung) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie K (BT-118).\nBR-IC-2: Hat eine Position (BT-151) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-5: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-G-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie G (Ausfuhr aus der EU) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie G (BT-118).\nBR-G-2: Hat eine Position (BT-151) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-5: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-O-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie O (nicht steuerbar) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie O (BT-118).\nBR-O-2: Hat eine Position (BT-151) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-5: Bei Kategorie O (nicht steuerbar) hat die Position keinen Steuersatz (BT-152).\nBR-O-12: Bei Kategorie O (nicht steuerbar) müssen alle Positionen Kategorie O haben (BT-151).\nBR-IG-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie L (IGIC, Kanarische Inseln) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie L (BT-118).\nBR-IG-2: Hat eine Position (BT-151) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-5: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz der Position (BT-152) 0 oder größer sein.\nBR-IP-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie M (IPSI, Ceuta und Melilla) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie M (BT-118).\nBR-IP-2: Hat eine Position (BT-151) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-5: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz der Position (BT-152) 0 oder größer sein.
BT-126.name=Kennung der Rechnungsposition
BT-126.use=Die Nummer der Position, eindeutig innerhalb der Rechnung, z. B. 1, 2, 3.
BT-126.rules=BR-21: Jede Position (BG-25) braucht eine Positionsnummer (BT-126).
BT-127.name=Freitext zur Rechnungsposition
BT-127.use=Ein Freitext zu dieser Position.
BT-128.name=Objektkennung auf Ebene der Rechnungsposition
BT-128.use=Das Objekt, um das es in dieser Position geht.
BT-128.note=Z. B. Abonnement-, Telefon- oder Zählernummer. Ist die Art der Nummer nicht klar, ein Schema angeben (Code aus UNTDID 1153).
BT-128-1.name=Kennung des Schemas
BT-128-1.use=Die Art der Objektkennung (BT-128).
BT-129.name=in Rechnung gestellte Menge
BT-129.use=Die in dieser Position berechnete Menge.
BT-129.rules=BR-22: Jede Position (BG-25) braucht eine Menge (BT-129).
BT-130.name=Code der Maßeinheit der in Rechnung gestellten Menge
BT-130.use=Die Einheit der Menge, z. B. H87 für Stück, HUR für Stunde, KGM für Kilogramm.
BT-130.note=Codes aus UN/ECE-Empfehlung 20 und 21. Sie brauchen nur die Einheiten, die Sie tatsächlich verwenden; der Käufer prüft, ob sie zu Bestellung und Lieferschein passen.
BT-130.rules=BR-23: Jede Position (BG-25) braucht eine Einheit für die Menge (BT-130).
BT-131.name=Nettobetrag der Rechnungsposition
BT-131.use=Der Nettobetrag der Position.
BT-131.note=Ohne Umsatzsteuer, aber mit den Ab- und Zuschlägen dieser Position.
BT-131.rules=BR-24: Jede Position (BG-25) braucht einen Nettobetrag (BT-131).\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-Z-8: Für Kategorie Z (Nullsatz): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-E-8: Für Kategorie E (steuerbefreit): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-AE-8: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IC-8: Für Kategorie K (innergemeinschaftliche Lieferung): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-G-8: Für Kategorie G (Ausfuhr aus der EU): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-8: Für Kategorie O (nicht steuerbar): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
BT-132.name=Referenz zur Bestellposition
BT-132.use=Die Positionsnummer in der Bestellung des Käufers.
BT-132.note=Die Bestellnummer selbst steht bei der ganzen Rechnung (BT-13).
BT-133.name=Buchungsreferenz des Käufers für die Rechnungsposition
BT-133.use=Wo der Käufer diese Position bucht, z. B. Kostenstelle.
BT-133.note=Der Käufer teilt Ihnen das vor der Rechnungsstellung mit.
BG-26.name=RECHNUNGSPOSITIONSZEITRAUM
BG-26.use=Der Zeitraum dieser Position (Leistungszeitraum der Position).
BG-26.note=Anfangsdatum, Enddatum oder beides angeben.
BT-134.name=Anfangsdatum des Rechnungspositionszeitraums
BT-134.use=Der erste Tag des Zeitraums dieser Position.
BT-134.rules=BR-CO-20: Ein Positionszeitraum (BG-26) braucht ein Anfangsdatum (BT-134), ein Enddatum (BT-135) oder beides.
BT-135.name=Enddatum des Rechnungspositionszeitraums
BT-135.use=Der letzte Tag des Zeitraums dieser Position.
BT-135.rules=BR-30: Das Ende des Positionszeitraums (BT-135) darf nicht vor dem Anfang (BT-134) liegen.\nBR-CO-20: Ein Positionszeitraum (BG-26) braucht ein Anfangsdatum (BT-134), ein Enddatum (BT-135) oder beides.
BG-27.name=ABSCHLÄGE AUF EBENE DER RECHNUNGSPOSITION
BG-27.use=Ein Abschlag (Nachlass) auf diese Position.
BT-136.name=Betrag des Abschlags auf Ebene der Rechnungsposition
BT-136.use=Der Betrag des Abschlags ohne Umsatzsteuer.
BT-136.rules=BR-41: Jeder Abschlag auf eine Position (BG-27) braucht einen Betrag (BT-136).
BT-137.name=Grundbetrag des Abschlags auf Ebene der Rechnungsposition
BT-137.use=Der Grundbetrag, auf den sich der Prozentsatz des Abschlags (BT-138) bezieht.
BT-138.name=prozentualer Abschlag auf Ebene der Rechnungsposition
BT-138.use=Der Abschlag in Prozent vom Grundbetrag (BT-137).
BT-139.name=Grund für den Abschlag auf Ebene der Rechnungsposition
BT-139.use=Der Grund des Abschlags als Text.
BT-139.rules=BR-42: Jeder Abschlag auf eine Position (BG-27) braucht einen Grund, als Text (BT-139) oder Code (BT-140).\nBR-CO-7: Code (BT-140) und Text (BT-139) des Abschlaggrunds einer Position müssen dasselbe aussagen.\nBR-CO-23: Jeder Abschlag auf eine Position (BG-27) braucht einen Grund als Text (BT-139), als Code (BT-140) oder beides.
BT-140.name=Code für den Grund für den Abschlag auf Ebene der Rechnungsposition
BT-140.use=Der Grund des Abschlags als Code.
BT-140.note=Codes aus UNTDID 5189. Code und Text (BT-139) müssen dasselbe aussagen.
BT-140.rules=BR-42: Jeder Abschlag auf eine Position (BG-27) braucht einen Grund, als Text (BT-139) oder Code (BT-140).\nBR-CO-7: Code (BT-140) und Text (BT-139) des Abschlaggrunds einer Position müssen dasselbe aussagen.\nBR-CO-23: Jeder Abschlag auf eine Position (BG-27) braucht einen Grund als Text (BT-139), als Code (BT-140) oder beides.
BG-28.name=ZUSCHLÄGE AUF EBENE DER RECHNUNGSPOSITION
BG-28.use=Ein Zuschlag (Aufschlag, Gebühr oder Steuer außer der Umsatzsteuer) auf diese Position.
BG-28.note=Er hat denselben Umsatzsteuersatz wie die Position.
BT-141.name=Betrag des Zuschlags auf Ebene der Rechnungsposition
BT-141.use=Der Betrag des Zuschlags ohne Umsatzsteuer.
BT-141.rules=BR-43: Jeder Zuschlag auf eine Position (BG-28) braucht einen Betrag (BT-141).
BT-142.name=Grundbetrag des Zuschlags auf Ebene der Rechnungsposition
BT-142.use=Der Grundbetrag, auf den sich der Prozentsatz des Zuschlags (BT-143) bezieht.
BT-143.name=prozentualer Zuschlag auf Ebene der Rechnungsposition
BT-143.use=Der Zuschlag in Prozent vom Grundbetrag (BT-142).
BT-144.name=Grund für den Zuschlag auf Ebene der Rechnungsposition
BT-144.use=Der Grund des Zuschlags als Text.
BT-144.rules=BR-44: Jeder Zuschlag auf eine Position (BG-28) braucht einen Grund, als Text (BT-144) oder Code (BT-145).\nBR-CO-8: Code (BT-145) und Text (BT-144) des Zuschlaggrunds einer Position müssen dasselbe aussagen.\nBR-CO-24: Jeder Zuschlag auf eine Position (BG-28) braucht einen Grund als Text (BT-144), als Code (BT-145) oder beides.
BT-145.name=Code für den Grund für den Zuschlag auf Ebene der Rechnungsposition
BT-145.use=Der Grund des Zuschlags als Code.
BT-145.note=Codes aus UNTDID 7161. Code und Text (BT-144) müssen dasselbe aussagen.
BT-145.rules=BR-44: Jeder Zuschlag auf eine Position (BG-28) braucht einen Grund, als Text (BT-144) oder Code (BT-145).\nBR-CO-8: Code (BT-145) und Text (BT-144) des Zuschlaggrunds einer Position müssen dasselbe aussagen.\nBR-CO-24: Jeder Zuschlag auf eine Position (BG-28) braucht einen Grund als Text (BT-144), als Code (BT-145) oder beides.
BG-29.name=DETAILINFORMATIONEN ZUM PREIS
BG-29.use=Der Preis des Artikels dieser Position.
BT-146.name=Nettopreis des Artikels
BT-146.use=Der Preis je Einheit ohne Umsatzsteuer, nach Abzug des Preisnachlasses.
BT-146.note=Bruttopreis (BT-148) minus Preisnachlass (BT-147).
BT-146.rules=BR-26: Jede Position (BG-25) braucht einen Nettopreis (BT-146).\nBR-27: Der Nettopreis (BT-146) darf nicht negativ sein.
BT-147.name=Nachlass auf den Artikelpreis
BT-147.use=Der Nachlass je Einheit, der vom Bruttopreis abgezogen wird.
BT-147.note=Nur wenn der Nachlass je Einheit gewährt wird und nicht schon im Bruttopreis steckt.
BT-148.name=Bruttopreis des Artikels
BT-148.use=Der Preis je Einheit ohne Umsatzsteuer, vor Abzug des Preisnachlasses (Listenpreis).
BT-148.rules=BR-28: Der Bruttopreis (BT-148) darf nicht negativ sein.
BT-149.name=Basismenge zum Artikelpreis
BT-149.use=Die Anzahl Einheiten, für die der Preis gilt, z. B. 100 bei einem Preis je 100 Stück.
BT-150.name=Code der Maßeinheit der Basismenge zum Artikelpreis
BT-150.use=Die Einheit dieser Basismenge.
BT-150.note=Muss dieselbe Einheit sein wie bei der berechneten Menge (BT-130).
BG-30.name=UMSATZSTEUERINFORMATIONEN AUF DER EBENE DER RECHNUNGSPOSITION
BG-30.use=Die Umsatzsteuer des Artikels dieser Position.
BT-151.name=Code der Umsatzsteuerkategorie des in Rechnung gestellten Artikels
BT-151.use=Die Umsatzsteuerkategorie des Artikels, z. B. S für den Normalsatz.
BT-151.note=S Normalsatz, Z Nullsatz, E steuerbefreit, AE Umkehrung der Steuerschuldnerschaft, K innergemeinschaftliche Lieferung, G Ausfuhr aus der EU, O nicht steuerbar, L Kanarische Inseln (IGIC), M Ceuta und Melilla (IPSI).
BT-151.rules=BR-CO-4: Jede Position (BG-25) braucht eine Umsatzsteuerkategorie (BT-151).\nBR-S-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie S (Normalsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie S (BT-118).\nBR-S-2: Hat eine Position (BT-151) die Kategorie S (Normalsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-S-5: Bei Kategorie S (Normalsatz) muss der Steuersatz der Position (BT-152) größer als 0 sein.\nBR-S-8: Für jeden Steuersatz der Kategorie S (Normalsatz) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-Z-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie Z (Nullsatz) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie Z (BT-118).\nBR-Z-2: Hat eine Position (BT-151) die Kategorie Z (Nullsatz): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-Z-5: Bei Kategorie Z (Nullsatz) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-Z-8: Für Kategorie Z (Nullsatz): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-E-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie E (steuerbefreit) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie E (BT-118).\nBR-E-2: Hat eine Position (BT-151) die Kategorie E (steuerbefreit): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-E-5: Bei Kategorie E (steuerbefreit) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-E-8: Für Kategorie E (steuerbefreit): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-AE-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie AE (Umkehrung der Steuerschuldnerschaft) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie AE (BT-118).\nBR-AE-2: Hat eine Position (BT-151) die Kategorie AE (Umkehrung der Steuerschuldnerschaft): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID (BT-48) oder Registernummer (BT-47) des Käufers.\nBR-AE-5: Bei Kategorie AE (Umkehrung der Steuerschuldnerschaft) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-AE-8: Für Kategorie AE (Umkehrung der Steuerschuldnerschaft): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-IC-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie K (innergemeinschaftliche Lieferung) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie K (BT-118).\nBR-IC-2: Hat eine Position (BT-151) die Kategorie K (innergemeinschaftliche Lieferung): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben, dazu die Umsatzsteuer-ID des Käufers (BT-48).\nBR-IC-5: Bei Kategorie K (innergemeinschaftliche Lieferung) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-IC-8: Für Kategorie K (innergemeinschaftliche Lieferung): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-G-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie G (Ausfuhr aus der EU) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie G (BT-118).\nBR-G-2: Hat eine Position (BT-151) die Kategorie G (Ausfuhr aus der EU): Ihre Umsatzsteuer-ID (BT-31) oder die Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-G-5: Bei Kategorie G (Ausfuhr aus der EU) muss der Steuersatz der Position (BT-152) 0 sein.\nBR-G-8: Für Kategorie G (Ausfuhr aus der EU): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie O (nicht steuerbar) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) genau einen Eintrag mit Kategorie O (BT-118).\nBR-O-2: Hat eine Position (BT-151) die Kategorie O (nicht steuerbar): keine Umsatzsteuer-IDs angeben (BT-31, BT-63, BT-48).\nBR-O-5: Bei Kategorie O (nicht steuerbar) hat die Position keinen Steuersatz (BT-152).\nBR-O-8: Für Kategorie O (nicht steuerbar): Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) − Abschläge (BT-92) + Zuschläge (BT-99) mit dieser Kategorie.\nBR-O-12: Bei Kategorie O (nicht steuerbar) müssen alle Positionen Kategorie O haben (BT-151).\nBR-IG-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie L (IGIC, Kanarische Inseln) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie L (BT-118).\nBR-IG-2: Hat eine Position (BT-151) die Kategorie L (IGIC, Kanarische Inseln): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IG-5: Bei Kategorie L (IGIC, Kanarische Inseln) muss der Steuersatz der Position (BT-152) 0 oder größer sein.\nBR-IG-8: Für jeden Steuersatz der Kategorie L (IGIC, Kanarische Inseln) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).\nBR-IP-1: Hat eine Position, ein Abschlag oder Zuschlag die Kategorie M (IPSI, Ceuta und Melilla) (BT-151, BT-95, BT-102), braucht die Umsatzsteueraufschlüsselung (BG-23) einen Eintrag mit Kategorie M (BT-118).\nBR-IP-2: Hat eine Position (BT-151) die Kategorie M (IPSI, Ceuta und Melilla): Ihre Umsatzsteuer-ID (BT-31), Ihre Steuernummer (BT-32) oder die Umsatzsteuer-ID Ihres Steuerbevollmächtigten (BT-63) angeben.\nBR-IP-5: Bei Kategorie M (IPSI, Ceuta und Melilla) muss der Steuersatz der Position (BT-152) 0 oder größer sein.\nBR-IP-8: Für jeden Steuersatz der Kategorie M (IPSI, Ceuta und Melilla) gilt: Steuerbasisbetrag (BT-116) = Summe der Positionen (BT-131) + Zuschläge (BT-99) − Abschläge (BT-92) mit dieser Kategorie und diesem Satz (BT-152, BT-103, BT-96).
