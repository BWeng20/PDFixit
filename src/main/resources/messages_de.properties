redact.help.text=<html><font size='+2'><b>So funktioniert das Schwärzen</b></font><br><br><font size='+1'>Ein schwarzer Kasten über dem Text entfernt diesen nicht: Der Text steckt weiterhin in der Datei<br>und kann kopiert oder extrahiert werden. Dieses Werkzeug arbeitet deshalb anders:<ol><li>Jede Seite mit markierten Bereichen wird <b>in ein Bild gerendert</b> (Auflösung aus<br><i>Optionen / Renderqualität</i>).</li><li>Die markierten Bereiche werden mit der gewählten Farbe in dieses Bild <b>gemalt</b>.</li><li>Die ursprüngliche Seite wird <b>durch das Bild ersetzt</b>.</li></ol>Aller Text, alle Vektorgrafiken und Bilder einer geschwärzten Seite sind wirklich weg – nicht nur,<br>was unter den Kästen liegt. Seiten ohne markierte Bereiche bleiben unverändert.<br><br><b>Folgen für geschwärzte Seiten:</b><ul><li>Text lässt sich nicht mehr markieren oder durchsuchen (es findet keine Texterkennung statt).</li><li>Links, Kommentare und Formularfelder der Seite entfallen.</li><li>Die Datei wird größer, abhängig von der Auflösung.</li></ul><b>Nicht entfernt</b> – prüfen Sie das selbst:<ul><li>Lesezeichen (Gliederung), Dokumentinformationen (Titel, Autor, ...) und XMP-Metadaten.</li><li>Angehängte Dateien. Eine E-Rechnung wird erkannt, Sie werden gefragt, was damit geschehen soll.</li><li>Werte von Formularfeldern: Sie sind außerhalb der Seite gespeichert.</li></ul><b>Die Textsuche</b> findet nur echten Text. Text in Bildern (z. B. gescannte Seiten)<br>wird nicht gefunden, markieren Sie solche Bereiche mit der Maus.</font></html>
