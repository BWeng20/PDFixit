help.permissions.text=<html><font size='+2'><b>So setzen Sie PDF-Berechtigungen</b></font><br><font size='+1'>Um unbefugten Zugriff auf ein PDF zu verhindern, genügt ein <b>Benutzerkennwort</b>.<br>Das Benutzerkennwort ist zum Öffnen des Dokuments nötig.<br><br>Wenn Sie bestimmte Berechtigungen festlegen möchten – etwa Drucken oder<br>Bearbeiten einschränken –, müssen Sie ein <b>Besitzerkennwort</b> setzen.<br>Das <b>Besitzerkennwort</b> gewährt immer volle Kontrolle über das Dokument,<br>ist zum Öffnen aber nicht erforderlich.<br>Wird ein Dokument mit Besitzerkennwort ohne dieses Kennwort geöffnet,<br>gelten die gewählten Berechtigungen. Programme fragen es normalerweise nicht ab.<br><br>Die meisten Programme, die Berechtigungen setzen, verwenden ein verstecktes, automatisch erzeugtes Besitzerkennwort,<br>damit Benutzer keinen vollen Zugriff erhalten.<br><br>Verwenden Sie dasselbe Kennwort als Benutzer- und als Besitzerkennwort, haben die Einschränkungen<br>keine Wirkung, da das eine eingegebene Kennwort die Anforderung des <b>Besitzerkennworts</b> erfüllt<br>und das Dokument mit vollen Besitzerrechten öffnet.<br><br><b>Hinweis:</b> Die Berechtigung <i>Anmerkungen</i> umfasst Formulare, Kommentare und Signaturen.</font></html>
ui.border.signing=Signieren
help.signing.text=<html><font size='+2'><b>So signieren Sie ein PDF</b></font><br><br><font size='+1'>Zum Signieren brauchen Sie eine <b>P12-Schlüsseldatei</b> mit einem <b>X.509-Zertifikat</b><br>mit folgenden Bestandteilen:<br><ul><li><b>Privater Schlüssel:</b> Er ist nötig, um die digitale Signatur zu erzeugen.<br>Er belegt Ihre Identität.</li><li><b>Zertifikatskette:</b> Eine Reihe von Zertifikaten, die Ihr Zertifikat<br>mit einer vertrauenswürdigen Stammzertifizierungsstelle (CA) verbindet.</li><li><b>Common Name (CN):</b> Dieses Attribut kennzeichnet den Unterzeichner und<br>wird im Betrachter üblicherweise als dessen Name angezeigt.</li></ul>Damit Ihre Signatur vom System des Empfängers akzeptiert wird, muss die Zertifikatskette<br>letztlich auf einer Stammzertifizierungsstelle (CA) beruhen, die auf dem Zielsystem<br>bereits installiert ist und der dort vertraut wird.<br><br><b>Möglichkeiten für Zertifikate:</b><ul><li><b>Gekaufte Zertifikate:</b><br>Sie können Zertifikate bei kommerziellen CAs (wie DigiCert, Comodo usw.) kaufen,<br>deren Stammzertifikate weithin als vertrauenswürdig gelten.</li><br><li><b>Selbstsignierte Zertifikate</b>:<br>Sie können eigene erstellen.<br>Damit solche Signaturen geprüft werden können, müssen Sie den öffentlichen<br>Teil Ihres selbstsignierten Zertifikats an die Empfänger des PDFs weitergeben,<br>und diese müssen es von Hand zu ihren vertrauenswürdigen Identitäten hinzufügen.<br></font></html>
