cli.merge=Reißverschluss-Mischen statt Anhängen. '5-2-3' beginnt vor Seite 5 des aktuellen Dokuments, fügt 2 Seiten des neuen Dokuments ein, überspringt 3 Seiten, fügt wieder 2 Seiten ein, überspringt wieder 3 usw., bis alle neuen Seiten hinzugefügt sind.
cli.certificate=Signiert das entstehende PDF mit einem Zertifikat aus einer p12-Datei.
cli.certificatePassword=Kennwort für das Zertifikat.
cli.redactText=Entfernt allen Text, der zum regulären Ausdruck passt, dauerhaft. Die betroffenen Seiten werden in Bilder umgewandelt.
cli.redactArea=Entfernt einen Bereich dauerhaft. Werte in Punkt (1/72 Zoll) von der linken oberen Ecke der Seite, z. B. '1:50,100,200,20'. Die betroffenen Seiten werden in Bilder umgewandelt.
cli.attachInvoice=Hängt eine Rechnung (ZUGFeRD/Factur-X, CII-Syntax) an das entstehende PDF an. Eine vorhandene Rechnung wird ersetzt. Das Ergebnis ist nur gültig, wenn das PDF PDF/A-3-konform ist, prüfen Sie das mit '-vi'.
cli.extractInvoice=Schreibt die Rechnung (ZUGFeRD/Factur-X) des geladenen Dokuments in eine Datei.
cli.removeInvoice=Entfernt die Rechnung aus dem Dokument. Erforderlich, wenn Sie ein Dokument mit Rechnung schwärzen.
cli.validateInvoice=Validiert das entstehende PDF und seine Rechnung (PDF/A-3 und EN 16931). Kann nicht mit '--split' kombiniert werden.
cli.validatePdfa=Validiert das entstehende PDF mit veraPDF gegen die PDF/A-Variante, die es deklariert (ein PDF ohne Deklaration wird als solches gemeldet). Kann nicht mit '--split' kombiniert werden.
cli.debug=Zeigt Debug-Ausgaben und Stacktraces. Auch mit der Systemeigenschaft 'pdfixit.debug=true' möglich. Kann zusammen mit Dateinamen verwendet werden, um die Oberfläche im Debug-Modus zu starten.
usage.footer.0=%n
usage.footer.1=Die Berechtigungs-Optionen wirken nur, wenn ein Besitzer- oder Benutzerkennwort angegeben ist.
usage.footer.2=Wird nur das Benutzerkennwort angegeben, wird das Besitzerkennwort auf einen Zufallswert gesetzt.
