cli.generateInvoice=Erzeugt eine E-Rechnung: setzt die Rechnungs-XML (CII) auf den mit '--template' angegebenen Briefbogen (das Layout wird neben der Vorlage oder im Layout-Ordner des Programms gefunden, siehe '--layout'), hängt die XML an und schreibt das Ergebnis nach '--out'. Braucht kein Eingabe-PDF. Lässt sich nur mit den Optionen der Rechnungserzeugung kombinieren.
cli.template=Das Briefbogen-PDF für '--generateInvoice'. Ein einfaches PDF ohne Markierungen; es wird nie verändert.
cli.layout=Eine Layout-Datei (JSON) für '--generateInvoice' statt der, die zur Vorlage gefunden wird. Ohne Layout-Datei gelten die Vorgaben nach DIN 5008.
cli.continuation=Die Quelle der Folgeseiten einer langen Rechnung, wenn das Layout keine nennt: 'template' (Seite 2 der Vorlage), 'page1' (Seite 1 noch einmal), 'blank' (leere Seiten) oder der Name einer PDF-Datei, deren erste Seite benutzt wird. Die Layout-Datei wird nicht verändert. Ohne diese Option ist eine lange Rechnung auf einer einseitigen Vorlage ein Fehler.
cli.pdfaLevel=Die PDF/A-3-Stufe der erzeugten Rechnung: a, b oder u. Vorgabe: die Einstellung des E-Rechnungs-Assistenten (sonst u).
cli.language=Die Sprache der gedruckten Rechnung: de oder en. Vorgabe: die Einstellung des E-Rechnungs-Assistenten, sonst die Sprache des Programms.
