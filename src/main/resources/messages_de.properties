redact.aa.tip=<html>Kantenglättung: glatte Kanten gedrehter Bereiche im Editor und im Ergebnis.<br>Aus (sicherer): Jedes Pixel, das ein Bereich berührt, wird vollständig abgedeckt.<br>An: Randpixel werden nur teilweise abgedeckt, eine schwache Spur des Textes darunter kann bleiben.</html>
