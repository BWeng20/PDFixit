help.wizard.invoice.text=<html><font size='+2'><b>E-Rechnungs-Assistent</b></font><br><br><font size='+1'>Der Assistent erstellt eine E-Rechnung (ZUGFeRD / Factur-X): Die Rechnung wird auf Ihren Briefbogen gedruckt, und dieselben Daten werden als XML an das PDF angehängt.<br><br>Die Schritte links zeigen, wo Sie sind. <i><b>Weiter</b></i> ist möglich, wenn im Schritt nichts fehlt; die Zeile über den Knöpfen nennt das erste Problem.<br><br><b>1 Ziel:</b> eine neue Rechnung auf einem Briefbogen, eine Rechnung zu einem vorhandenen PDF hinzufügen (die Seiten bleiben, wie sie sind) oder von einer Rechnungs-XML-Datei ausgehen. Hier wählen Sie auch Dokumenttyp und Profil. Nicht jedes Profil gilt in jedem Land als E-Rechnung, bitte prüfen Sie, welche für Sie zulässig sind.<br><br><b>2 Verkäufer, 3 Käufer, 4 Positionen, 5 Zahlung:</b> die Rechnungsdaten. Verkäufer und Käufer lassen sich speichern und wieder auswählen.<br><br><b>6 Vorlage:</b> der Briefbogen, ein einfaches PDF ohne Markierungen. Die letzten fünf Vorlagen stehen in der Liste. Die Layout-Datei neben dem PDF (oder im Ordner .pdfixit/layouts Ihres Benutzerordners) legt fest, wohin die Felder kommen; ohne sie gelten die Positionen nach DIN 5008. <i><b>Layout bearbeiten...</b></i> öffnet den Layout-Editor.<br><br><b>7 Prüfung:</b> Die Rechnung wird erzeugt und geprüft (EN 16931 und PDF/A-3). Probleme stehen in einer Liste mit einem Link zum Schritt oder zum Layout-Editor, der sie behebt. Hier wählen Sie auch die PDF/A-Stufe (u, b oder a) und die Sprache der gedruckten Rechnung. Braucht die Rechnung mehr als eine Seite und die Vorlage hat eine, werden Sie gefragt, woher die Folgeseiten kommen.<br><br><i><b>Fertigstellen</b></i> öffnet die Rechnung als aktuelles Dokument. Sie ist noch nicht gespeichert.</font></html>
help.layoutEditor.text=<html><font size='+2'><b>Layout-Editor</b></font><br><br><font size='+1'>Das Layout legt fest, wo die Rechnung auf Ihren Briefbogen gedruckt wird. Der Briefbogen selbst wird nie verändert; das Layout wird als kleine Datei neben dem PDF gespeichert (oder im Ordner .pdfixit/layouts Ihres Benutzerordners, wenn der Ordner des PDFs nicht beschreibbar ist), und der Editor sagt Ihnen, wo.<br><br>Die Seite des Briefbogens wird mit den Bereichen der Elemente gezeigt. Ziehen Sie einen Bereich, um ihn zu verschieben, und seine Griffe, um die Größe zu ändern. Die Liste links enthält die Elemente: die Felder der Rechnung, die Adressblöcke, den Schlusstext und Bilder. Ein <b>festes</b> Element hat einen Bereich auf Seite 1 oder auf den Folgeseiten. Elemente des <b>Textbereichs</b> haben keinen eigenen Bereich: Sie werden nacheinander im Textbereich gedruckt und wandern mit dem Inhalt darüber, in der Reihenfolge der Liste.<br><br>Das Programm druckt vor jedem Wert eine <b>Beschriftung</b>. Sie lässt sich verschieben, ausschalten (Entf) und mit ihrem Standardtext wieder einschalten. Ein Text und ein Bild (zum Beispiel eine Unterschrift) lassen sich hinzufügen; das Bild wird in der Layout-Datei gespeichert, jeder, der die Datei bekommt, kann es sehen.<br><br><b>Beispieldaten</b> zeigen die Wirkung mit einer erfundenen Rechnung. Die Warnungen unten sagen, wenn ein Bereich Text des Briefbogens enthält, die Seite verlässt oder für einen Wert zu klein ist. Grafiken des Briefbogens werden nicht erkannt, die Vorschau zeigt sie.<br><br><b>Folgeseiten:</b> Seite 2 der Vorlage, Seite 1 noch einmal, ein anderes PDF oder eine leere Seite. <b>Auf DIN 5008 zurücksetzen</b> setzt alles wie in der Norm (Form A oder B).</font></html>
