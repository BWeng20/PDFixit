help.invoice.text=<html><font size='+2'><b>E-Rechnungen (ZUGFeRD / Factur-X)</b></font><br><br><font size='+1'>Eine E-Rechnung ist ein PDF/A-3-Dokument mit eingebetteten E-Rechnungsdaten im XML-Format.<br>Dadurch kann die E-Rechnung sowohl von Menschen gelesen als auch von Programmen automatisch verarbeitet werden.<br><br>Der Editor in diesem Reiter dient zum Erstellen und Bearbeiten der E-Rechnung des aktuellen Dokuments.<br>Ihre Änderungen bleiben zunächst ein Entwurf und werden erst durch <i><b>Ins Dokument übernehmen</b></i> in das Dokument übernommen (in der Leiste am unteren Rand des Reiters).<br>Dabei wird die E-Rechnung geprüft und als XML-Datei eingebettet. Eine bereits vorhandene E-Rechnung wird ersetzt, nicht zusätzlich eingefügt.<br>Ungültige E-Rechnungen können nicht übernommen werden. Beim Speichern des Dokuments werden die übernommenen E-Rechnungsdaten ebenfalls gespeichert.<br><br>Dabei werden ausschließlich die E-Rechnungsdaten geändert, <b>nicht die sichtbaren Seiten des PDF-Dokuments</b>.<br><br>Die Markierung <b>Geändert</b> in der Ecke des Editors zeigt an, dass der Inhalt des Editors von der im Dokument gespeicherten E-Rechnung abweicht.<br>Mit <b>Änderungen verwerfen</b> setzen Sie den Editor auf den aktuellen Stand des Dokuments zurück.<br><br>Das Feld <b>E-Rechnung im Dokument</b> zeigt an, ob das Dokument eine gültige E-Rechnung enthält.<br>Beim Laden oder Ändern des Dokuments wird die E-Rechnung automatisch anhand der PDF/A-3-Anforderungen sowie der europäischen Norm EN 16931 geprüft.<br>Diese Prüfung verändert das Dokument niemals.<br>Über <b>Details</b> können Sie alle Meldungen und den vollständigen Prüfbericht anzeigen.<br><br><b>Profil:</b> Das Profil bestimmt, welche Daten die E-Rechnung enthält. Nicht jedes Profil wird in jedem Land als rechtsgültige E-Rechnung anerkannt.<br>Insbesondere die Profile <b>Minimum</b> und <b>Basic WL</b> erfüllen häufig nicht die Anforderungen für den elektronischen Rechnungsaustausch.<br><b>Bitte informieren Sie sich, welche Profile in Ihrem Anwendungsfall zulässig sind.</b></font></html>
