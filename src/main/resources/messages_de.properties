ui.standardButton.tip=<html>Ändert die PDF/A-Stufe des Dokuments (die aktuelle Stufe steht daneben).<br>Der Dialog zeigt, was geändert wird und was verloren geht.<br>Ein Dokument, das PDF/A deklariert, bleibt konform: Kennwörter, Berechtigungen und Verschlüsselung, Aufteilen,<br>Anhängen von Dokumenten ohne PDF/A und das Umwandeln von Seiten in Bilder bei einem Ausgabeintent ohne RGB<br>sind deaktiviert. Ein geladenes Dokument wird nur repariert, wenn Sie zustimmen. Das Hinzufügen einer Rechnung erfordert PDF/A-3:<br>Sie werden gefragt, ob das Dokument umgestellt werden soll, sonst wird der Vorgang abgebrochen.</html>
