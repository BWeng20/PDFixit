          height="27" width="19"/>
    <!-- Two arrows beside each other, the tips up. -->
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6.5,11 V23.5 M14.5,11 V23.5"/>
    <path fill="currentColor" stroke="none" d="M6.5,5 L9.7,11.5 H3.3 Z M14.5,5 L17.7,11.5 H11.3 Z"/>
