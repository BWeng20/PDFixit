BT-104.rules=BR-38: Each charge on the invoice (BG-21) needs a reason, as text (BT-104) or code (BT-105).\nBR-CO-6: Reason code (BT-105) and reason text (BT-104) of a charge must say the same.\nBR-CO-22: Each charge on the invoice (BG-21) needs a reason text (BT-104), a reason code (BT-105) or both.
BT-105.name=Document level charge reason code
BT-105.card=0..1
BT-105.type=code
BT-105.use=The reason for the charge as code.
BT-105.note=Codes of UNTDID 7161. Code and text (BT-104) must say the same.
BT-105.rules=BR-38: Each charge on the invoice (BG-21) needs a reason, as text (BT-104) or code (BT-105).\nBR-CO-6: Reason code (BT-105) and reason text (BT-104) of a charge must say the same.\nBR-CO-22: Each charge on the invoice (BG-21) needs a reason text (BT-104), a reason code (BT-105) or both.
BG-22.name=DOCUMENT TOTALS
BG-22.card=1..1
BG-22.use=The totals of the invoice.
BT-106.name=Sum of Invoice line net amount
BT-106.card=1..1
BT-106.type=amount
BT-106.use=The sum of the net amounts of all lines.
BT-106.rules=BR-12: The invoice needs the sum of the line net amounts (BT-106).\nBR-CO-10: Sum of the lines (BT-106) = sum of all line net amounts (BT-131).
BT-107.name=Sum of allowances on document level
BT-107.card=0..1
BT-107.type=amount
BT-107.use=The sum of all allowances for the whole invoice.
BT-107.note=Allowances of single lines are already in the line amounts.
BT-107.rules=BR-CO-11: Sum of allowances (BT-107) = sum of all invoice allowances (BT-92).
BT-108.name=Sum of charges on document level
BT-108.card=0..1
BT-108.type=amount
BT-108.use=The sum of all charges for the whole invoice.
BT-108.note=Charges of single lines are already in the line amounts.
BT-108.rules=BR-CO-12: Sum of charges (BT-108) = sum of all invoice charges (BT-99).
BT-109.name=Invoice total amount without VAT
BT-109.card=1..1
BT-109.type=amount
BT-109.use=The total of the invoice without VAT.
BT-109.note=Sum of the lines minus allowances plus charges of the whole invoice.
BT-109.rules=BR-13: The invoice needs the total without VAT (BT-109).\nBR-CO-13: Total without VAT (BT-109) = sum of the lines (BT-131) − allowances (BT-107) + charges (BT-108).
BT-110.name=Invoice total VAT amount
BT-110.card=0..1
BT-110.type=amount
BT-110.use=The total VAT of the invoice.
BT-110.note=The sum of the VAT amounts of all VAT categories.
BT-110.rules=BR-CO-14: Total VAT (BT-110) = sum of the VAT amounts of all categories (BT-117).
BT-111.name=Invoice total VAT amount in accounting currency
BT-111.card=0..1
BT-111.type=amount
BT-111.use=The total VAT in the accounting currency (BT-6).
BT-111.note=Only if the VAT accounting currency differs from the invoice currency. It does not count for the totals of the invoice.
BT-111.rules=BR-53: If a VAT accounting currency is given (BT-6), also give the VAT total in that currency (BT-111).
BT-112.name=Invoice total amount with VAT
BT-112.card=1..1
BT-112.type=amount
BT-112.use=The total of the invoice with VAT.
BT-112.note=Total without VAT plus the total VAT.
BT-112.rules=BR-14: The invoice needs the total with VAT (BT-112).\nBR-CO-15: Total with VAT (BT-112) = total without VAT (BT-109) + total VAT (BT-110).
BT-113.name=Paid amount
BT-113.card=0..1
BT-113.type=amount
BT-113.use=The amount already paid in advance.
BT-113.note=It is subtracted from the total with VAT to get the amount due.
BT-114.name=Rounding amount
BT-114.card=0..1
BT-114.type=amount
BT-114.use=An amount added to round the amount due.
BT-115.name=Amount due for payment
BT-115.card=1..1
BT-115.type=amount
BT-115.use=The amount still to be paid.
BT-115.note=Total with VAT minus the amount paid in advance. Zero if the invoice is fully paid; negative if you owe the buyer money.
BT-115.rules=BR-15: The invoice needs the amount due (BT-115).\nBR-CO-16: Amount due (BT-115) = total with VAT (BT-112) − paid amount (BT-113) + rounding (BT-114).
BG-23.name=VAT BREAKDOWN
BG-23.card=1..n
BG-23.use=The VAT broken down by category, rate and exemption reason: one entry per VAT category and rate.
BG-23.rules=BR-CO-18: The invoice needs at least one VAT breakdown (BG-23).\nBR-S-1: If a line, allowance or charge has VAT category S (standard rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category S (BT-118).\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-S-9: For category S (standard rate): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-S-10: Category S (standard rate) has no exemption reason (BT-120, BT-121).\nBR-Z-1: If a line, allowance or charge has VAT category Z (zero rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category Z (BT-118).\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-Z-9: For category Z (zero rate) the VAT amount (BT-117) is 0.\nBR-Z-10: Category Z (zero rate) has no exemption reason (BT-120, BT-121).\nBR-E-1: If a line, allowance or charge has VAT category E (exempt) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category E (BT-118).\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-9: For category E (exempt) the VAT amount (BT-117) is 0.\nBR-E-10: Category E (exempt) needs an exemption reason, as text (BT-120) or code (BT-121).\nBR-AE-1: If a line, allowance or charge has VAT category AE (reverse charge) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category AE (BT-118).\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-9: For category AE (reverse charge) the VAT amount (BT-117) is 0.\nBR-AE-10: Category AE (reverse charge) needs the exemption reason "reverse charge", as code (BT-121) or text (BT-120).\nBR-IC-1: If a line, allowance or charge has VAT category K (intra-community supply) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category K (BT-118).\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-9: For category K (intra-community supply) the VAT amount (BT-117) is 0.\nBR-IC-10: Category K (intra-community supply) needs the exemption reason "intra-community supply", as code (BT-121) or text (BT-120).\nBR-IC-11: For an intra-community supply (K), give the delivery date (BT-72) or the invoice period (BG-14).\nBR-IC-12: For an intra-community supply (K), give the country of the delivery address (BT-80).\nBR-G-1: If a line, allowance or charge has VAT category G (export outside the EU) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category G (BT-118).\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-9: For category G (export outside the EU) the VAT amount (BT-117) is 0.\nBR-G-10: Category G (export outside the EU) needs the exemption reason "export outside the EU", as code (BT-121) or text (BT-120).\nBR-O-1: If a line, allowance or charge has VAT category O (not subject to VAT) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category O (BT-118).\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-9: For category O (not subject to VAT) the VAT amount (BT-117) is 0.\nBR-O-10: Category O (not subject to VAT) needs the exemption reason "not subject to VAT", as code (BT-121) or text (BT-120).\nBR-O-11: With category O (not subject to VAT) the invoice has no other VAT breakdown (BG-23).\nBR-O-12: With category O (not subject to VAT) all lines must have category O (BT-151).\nBR-O-13: With category O (not subject to VAT) all invoice allowances must have category O (BT-95).\nBR-O-14: With category O (not subject to VAT) all invoice charges must have category O (BT-102).\nBR-IG-1: If a line, allowance or charge has VAT category L (IGIC, Canary Islands) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category L (BT-118).\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IG-9: For category L (IGIC, Canary Islands): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IG-10: Category L (IGIC, Canary Islands) has no exemption reason (BT-120, BT-121).\nBR-IP-1: If a line, allowance or charge has VAT category M (IPSI, Ceuta and Melilla) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category M (BT-118).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-9: For category M (IPSI, Ceuta and Melilla): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IP-10: Category M (IPSI, Ceuta and Melilla) has no exemption reason (BT-120, BT-121).
BT-116.name=VAT category taxable amount
BT-116.card=1..1
BT-116.type=amount
BT-116.use=The net amount taxed with this VAT category and rate.
BT-116.note=Sum of the lines minus allowances plus charges of the whole invoice that have this category and rate.
BT-116.rules=BR-45: Each VAT breakdown (BG-23) needs the taxable amount (BT-116).\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-S-9: For category S (standard rate): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IG-9: For category L (IGIC, Canary Islands): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-9: For category M (IPSI, Ceuta and Melilla): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).
BT-117.name=VAT category tax amount
BT-117.card=1..1
BT-117.type=amount
BT-117.use=The VAT amount of this category.
BT-117.note=Taxable amount (BT-116) times the rate (BT-119).
BT-117.rules=BR-46: Each VAT breakdown (BG-23) needs the VAT amount (BT-117).\nBR-CO-17: VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119) / 100, rounded to 2 decimals.\nBR-S-9: For category S (standard rate): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-Z-9: For category Z (zero rate) the VAT amount (BT-117) is 0.\nBR-E-9: For category E (exempt) the VAT amount (BT-117) is 0.\nBR-AE-9: For category AE (reverse charge) the VAT amount (BT-117) is 0.\nBR-IC-9: For category K (intra-community supply) the VAT amount (BT-117) is 0.\nBR-G-9: For category G (export outside the EU) the VAT amount (BT-117) is 0.\nBR-O-9: For category O (not subject to VAT) the VAT amount (BT-117) is 0.\nBR-IG-9: For category L (IGIC, Canary Islands): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IP-9: For category M (IPSI, Ceuta and Melilla): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).
BT-118.name=VAT category code
BT-118.card=1..1
BT-118.type=code
BT-118.use=The VAT category, e.g. S for standard rate.
BT-118.note=S standard rate, Z zero rate, E exempt, AE reverse charge, K intra-community supply, G export outside the EU, O not subject to VAT, L Canary Islands (IGIC), M Ceuta and Melilla (IPSI).
BT-118.rules=BR-47: Each VAT breakdown (BG-23) needs a VAT category (BT-118).\nBR-S-1: If a line, allowance or charge has VAT category S (standard rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category S (BT-118).\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-S-9: For category S (standard rate): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-S-10: Category S (standard rate) has no exemption reason (BT-120, BT-121).\nBR-Z-1: If a line, allowance or charge has VAT category Z (zero rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category Z (BT-118).\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-Z-9: For category Z (zero rate) the VAT amount (BT-117) is 0.\nBR-Z-10: Category Z (zero rate) has no exemption reason (BT-120, BT-121).\nBR-E-1: If a line, allowance or charge has VAT category E (exempt) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category E (BT-118).\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-9: For category E (exempt) the VAT amount (BT-117) is 0.\nBR-E-10: Category E (exempt) needs an exemption reason, as text (BT-120) or code (BT-121).\nBR-AE-1: If a line, allowance or charge has VAT category AE (reverse charge) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category AE (BT-118).\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-9: For category AE (reverse charge) the VAT amount (BT-117) is 0.\nBR-AE-10: Category AE (reverse charge) needs the exemption reason "reverse charge", as code (BT-121) or text (BT-120).\nBR-IC-1: If a line, allowance or charge has VAT category K (intra-community supply) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category K (BT-118).\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-9: For category K (intra-community supply) the VAT amount (BT-117) is 0.\nBR-IC-10: Category K (intra-community supply) needs the exemption reason "intra-community supply", as code (BT-121) or text (BT-120).\nBR-IC-11: For an intra-community supply (K), give the delivery date (BT-72) or the invoice period (BG-14).\nBR-IC-12: For an intra-community supply (K), give the country of the delivery address (BT-80).\nBR-G-1: If a line, allowance or charge has VAT category G (export outside the EU) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category G (BT-118).\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-9: For category G (export outside the EU) the VAT amount (BT-117) is 0.\nBR-G-10: Category G (export outside the EU) needs the exemption reason "export outside the EU", as code (BT-121) or text (BT-120).\nBR-O-1: If a line, allowance or charge has VAT category O (not subject to VAT) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category O (BT-118).\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-9: For category O (not subject to VAT) the VAT amount (BT-117) is 0.\nBR-O-10: Category O (not subject to VAT) needs the exemption reason "not subject to VAT", as code (BT-121) or text (BT-120).\nBR-O-11: With category O (not subject to VAT) the invoice has no other VAT breakdown (BG-23).\nBR-O-12: With category O (not subject to VAT) all lines must have category O (BT-151).\nBR-O-13: With category O (not subject to VAT) all invoice allowances must have category O (BT-95).\nBR-O-14: With category O (not subject to VAT) all invoice charges must have category O (BT-102).\nBR-IG-1: If a line, allowance or charge has VAT category L (IGIC, Canary Islands) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category L (BT-118).\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IG-9: For category L (IGIC, Canary Islands): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IG-10: Category L (IGIC, Canary Islands) has no exemption reason (BT-120, BT-121).\nBR-IP-1: If a line, allowance or charge has VAT category M (IPSI, Ceuta and Melilla) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category M (BT-118).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-9: For category M (IPSI, Ceuta and Melilla): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IP-10: Category M (IPSI, Ceuta and Melilla) has no exemption reason (BT-120, BT-121).
BT-119.name=VAT category rate
BT-119.card=0..1
BT-119.type=percentage
BT-119.use=The VAT rate of this category in percent, e.g. 19.
BT-119.note=Must fit the category (BT-118).
BT-119.rules=BR-48: Each VAT breakdown (BG-23) needs a VAT rate (BT-119), unless the invoice is not subject to VAT.\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-S-9: For category S (standard rate): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IG-9: For category L (IGIC, Canary Islands): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-9: For category M (IPSI, Ceuta and Melilla): VAT amount (BT-117) = taxable amount (BT-116) × rate (BT-119).
BT-120.name=VAT exemption reason text
BT-120.card=0..1
BT-120.type=text
BT-120.use=Why no VAT is charged, as text.
BT-120.note=E.g. the legal basis of the exemption, see Article 226 items 11 to 14 of Directive 2006/112/EC.
BT-120.rules=BR-S-10: Category S (standard rate) has no exemption reason (BT-120, BT-121).\nBR-Z-10: Category Z (zero rate) has no exemption reason (BT-120, BT-121).\nBR-E-10: Category E (exempt) needs an exemption reason, as text (BT-120) or code (BT-121).\nBR-AE-10: Category AE (reverse charge) needs the exemption reason "reverse charge", as code (BT-121) or text (BT-120).\nBR-IC-10: Category K (intra-community supply) needs the exemption reason "intra-community supply", as code (BT-121) or text (BT-120).\nBR-G-10: Category G (export outside the EU) needs the exemption reason "export outside the EU", as code (BT-121) or text (BT-120).\nBR-O-10: Category O (not subject to VAT) needs the exemption reason "not subject to VAT", as code (BT-121) or text (BT-120).\nBR-IG-10: Category L (IGIC, Canary Islands) has no exemption reason (BT-120, BT-121).\nBR-IP-10: Category M (IPSI, Ceuta and Melilla) has no exemption reason (BT-120, BT-121).
BT-121.name=VAT exemption reason code
BT-121.card=0..1
BT-121.type=code
BT-121.use=Why no VAT is charged, as code.
BT-121.note=Codes of the VATEX list.
BT-121.rules=BR-S-10: Category S (standard rate) has no exemption reason (BT-120, BT-121).\nBR-Z-10: Category Z (zero rate) has no exemption reason (BT-120, BT-121).\nBR-E-10: Category E (exempt) needs an exemption reason, as text (BT-120) or code (BT-121).\nBR-AE-10: Category AE (reverse charge) needs the exemption reason "reverse charge", as code (BT-121) or text (BT-120).\nBR-IC-10: Category K (intra-community supply) needs the exemption reason "intra-community supply", as code (BT-121) or text (BT-120).\nBR-G-10: Category G (export outside the EU) needs the exemption reason "export outside the EU", as code (BT-121) or text (BT-120).\nBR-O-10: Category O (not subject to VAT) needs the exemption reason "not subject to VAT", as code (BT-121) or text (BT-120).\nBR-IG-10: Category L (IGIC, Canary Islands) has no exemption reason (BT-120, BT-121).\nBR-IP-10: Category M (IPSI, Ceuta and Melilla) has no exemption reason (BT-120, BT-121).
BG-24.name=ADDITIONAL SUPPORTING DOCUMENTS
BG-24.card=0..n
BG-24.use=Supporting documents for the invoice, e.g. a time sheet.
BG-24.note=A document can be referenced by its number, linked by URL or attached (e.g. as PDF). Link large or sensitive documents instead of attaching them.
BT-122.name=Supporting document reference
BT-122.card=1..1
BT-122.type=reference
BT-122.use=The number or name of the supporting document.
BT-122.rules=BR-52: Each supporting document (BG-24) needs a number or name (BT-122).
BT-123.name=Supporting document description
BT-123.card=0..1
BT-123.type=text
BT-123.use=A description of the supporting document.
BT-123.note=E.g. time sheet or usage report.
BT-124.name=External document location
BT-124.card=0..1
BT-124.type=text
BT-124.use=The web address (URL) of an external document.
BT-124.note=External documents are not part of the invoice; it must be possible to process the invoice without them. Opening external links can be risky.
BT-125.name=Attached document
BT-125.card=0..1
BT-125.type=binary
BT-125.attributes=BT-125-1,BT-125-2
BT-125.use=A document attached to the invoice.
BT-125.note=For documents to keep with the invoice, e.g. for audits. Allowed types: PDF, PNG, JPEG, CSV, Excel (xlsx) and OpenDocument spreadsheets (ods).
BT-125-1.name=Attached document Mime code
BT-125-1.card=1..1
BT-125-1.use=The file type (MIME code) of the attached document, e.g. application/pdf.
BT-125-2.name=Attached document Filename
BT-125-2.card=1..1
BT-125-2.use=The file name of the attached document.
BG-25.name=INVOICE LINE
BG-25.card=1..n
BG-25.use=An item (line) of the invoice.
BG-25.rules=BR-16: The invoice needs at least one line (BG-25).\nBR-S-1: If a line, allowance or charge has VAT category S (standard rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category S (BT-118).\nBR-S-2: If a line (BT-151) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-S-5: With category S (standard rate) the VAT rate of the line (BT-152) must be greater than 0.\nBR-Z-1: If a line, allowance or charge has VAT category Z (zero rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category Z (BT-118).\nBR-Z-5: With category Z (zero rate) the VAT rate of the line (BT-152) must be 0.\nBR-E-1: If a line, allowance or charge has VAT category E (exempt) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category E (BT-118).\nBR-E-2: If a line (BT-151) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-5: With category E (exempt) the VAT rate of the line (BT-152) must be 0.\nBR-AE-1: If a line, allowance or charge has VAT category AE (reverse charge) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category AE (BT-118).\nBR-AE-2: If a line (BT-151) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-AE-5: With category AE (reverse charge) the VAT rate of the line (BT-152) must be 0.\nBR-IC-1: If a line, allowance or charge has VAT category K (intra-community supply) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category K (BT-118).\nBR-IC-2: If a line (BT-151) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-IC-5: With category K (intra-community supply) the VAT rate of the line (BT-152) must be 0.\nBR-G-1: If a line, allowance or charge has VAT category G (export outside the EU) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category G (BT-118).\nBR-G-2: If a line (BT-151) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-G-5: With category G (export outside the EU) the VAT rate of the line (BT-152) must be 0.\nBR-O-1: If a line, allowance or charge has VAT category O (not subject to VAT) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category O (BT-118).\nBR-O-2: If a line (BT-151) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-O-5: With category O (not subject to VAT) the line has no VAT rate (BT-152).\nBR-O-12: With category O (not subject to VAT) all lines must have category O (BT-151).\nBR-IG-1: If a line, allowance or charge has VAT category L (IGIC, Canary Islands) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category L (BT-118).\nBR-IG-2: If a line (BT-151) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IG-5: With category L (IGIC, Canary Islands) the VAT rate of the line (BT-152) must be 0 or more.\nBR-IP-1: If a line, allowance or charge has VAT category M (IPSI, Ceuta and Melilla) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category M (BT-118).\nBR-IP-2: If a line (BT-151) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-5: With category M (IPSI, Ceuta and Melilla) the VAT rate of the line (BT-152) must be 0 or more.
BT-126.name=Invoice line identifier
BT-126.card=1..1
BT-126.type=identifier
BT-126.use=The number of the line, unique within the invoice, e.g. 1, 2, 3.
BT-126.rules=BR-21: Each line (BG-25) needs a line number (BT-126).
BT-127.name=Invoice line note
BT-127.card=0..1
BT-127.type=text
BT-127.use=A free text note for this line.
BT-128.name=Invoice line object identifier
BT-128.card=0..1
BT-128.type=identifier
BT-128.attributes=BT-128-1
BT-128.use=The object this line is about.
BT-128.note=E.g. a subscription, phone or meter number. If the kind of number is not clear, add a scheme (code of UNTDID 1153).
BT-128-1.name=Scheme identifier
BT-128-1.card=0..1
BT-128-1.use=The kind of the object identifier (BT-128).
BT-129.name=Invoiced quantity
BT-129.card=1..1
BT-129.type=quantity
BT-129.attributes=BT-130
BT-129.use=The quantity invoiced in this line.
BT-129.rules=BR-22: Each line (BG-25) needs a quantity (BT-129).
BT-130.name=Invoiced quantity unit of measure code
BT-130.card=1..1
BT-130.type=code
BT-130.use=The unit of the quantity, e.g. H87 for piece, HUR for hour, KGM for kilogram.
BT-130.note=Codes of UN/ECE Recommendations 20 and 21. You only need the units you actually use; the buyer checks that they match order and delivery note.
BT-130.rules=BR-23: Each line (BG-25) needs a unit for the quantity (BT-130).
BT-131.name=Invoice line net amount
BT-131.card=1..1
BT-131.type=amount
BT-131.use=The net amount of the line.
BT-131.note=Without VAT, but with the allowances and charges of this line.
BT-131.rules=BR-24: Each line (BG-25) needs a net amount (BT-131).\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).
BT-132.name=Referenced purchase order line reference
BT-132.card=0..1
BT-132.type=reference
BT-132.use=The line number in the buyer's order.
BT-132.note=The order number itself is given for the whole invoice (BT-13).
BT-133.name=Invoice line Buyer accounting reference
BT-133.card=0..1
BT-133.type=text
BT-133.use=Where the buyer books this line, e.g. a cost centre.
BT-133.note=The buyer tells you this before the invoice is issued.
BG-26.name=INVOICE LINE PERIOD
BG-26.card=0..1
BG-26.use=The period this line covers (delivery period of the line).
BG-26.note=Give the start date, the end date or both.
BT-134.name=Invoice line period start date
BT-134.card=0..1
BT-134.type=date
BT-134.use=The first day of the period of this line.
BT-134.rules=BR-CO-20: A line period (BG-26) needs a start date (BT-134), an end date (BT-135) or both.
BT-135.name=Invoice line period end date
BT-135.card=0..1
BT-135.type=date
BT-135.use=The last day of the period of this line.
BT-135.rules=BR-30: The end of the line period (BT-135) must not be before its start (BT-134).\nBR-CO-20: A line period (BG-26) needs a start date (BT-134), an end date (BT-135) or both.
BG-27.name=INVOICE LINE ALLOWANCES
BG-27.card=0..n
BG-27.use=An allowance (discount) for this line.
BT-136.name=Invoice line allowance amount
BT-136.card=1..1
BT-136.type=amount
BT-136.use=The amount of the allowance, without VAT.
BT-136.rules=BR-41: Each allowance on a line (BG-27) needs an amount (BT-136).
BT-137.name=Invoice line allowance base amount
BT-137.card=0..1
BT-137.type=amount
BT-137.use=The base amount the allowance percentage (BT-138) refers to.
BT-138.name=Invoice line allowance percentage
BT-138.card=0..1
BT-138.type=percentage
BT-138.use=The allowance as percentage of the base amount (BT-137).
BT-139.name=Invoice line allowance reason
BT-139.card=0..1
BT-139.type=text
BT-139.use=The reason for the allowance as text.
BT-139.rules=BR-42: Each allowance on a line (BG-27) needs a reason, as text (BT-139) or code (BT-140).\nBR-CO-7: Reason code (BT-140) and reason text (BT-139) of a line allowance must say the same.\nBR-CO-23: Each allowance on a line (BG-27) needs a reason text (BT-139), a reason code (BT-140) or both.
BT-140.name=Invoice line allowance reason code
BT-140.card=0..1
BT-140.type=code
BT-140.use=The reason for the allowance as code.
BT-140.note=Codes of UNTDID 5189. Code and text (BT-139) must say the same.
BT-140.rules=BR-42: Each allowance on a line (BG-27) needs a reason, as text (BT-139) or code (BT-140).\nBR-CO-7: Reason code (BT-140) and reason text (BT-139) of a line allowance must say the same.\nBR-CO-23: Each allowance on a line (BG-27) needs a reason text (BT-139), a reason code (BT-140) or both.
BG-28.name=INVOICE LINE CHARGES
BG-28.card=0..n
BG-28.use=A charge (surcharge, fee or tax other than VAT) for this line.
BG-28.note=It has the same VAT rate as the line.
BT-141.name=Invoice line charge amount
BT-141.card=1..1
BT-141.type=amount
BT-141.use=The amount of the charge, without VAT.
BT-141.rules=BR-43: Each charge on a line (BG-28) needs an amount (BT-141).
BT-142.name=Invoice line charge base amount
BT-142.card=0..1
BT-142.type=amount
BT-142.use=The base amount the charge percentage (BT-143) refers to.
BT-143.name=Invoice line charge percentage
BT-143.card=0..1
BT-143.type=percentage
BT-143.use=The charge as percentage of the base amount (BT-142).
BT-144.name=Invoice line charge reason
BT-144.card=0..1
BT-144.type=text
BT-144.use=The reason for the charge as text.
BT-144.rules=BR-44: Each charge on a line (BG-28) needs a reason, as text (BT-144) or code (BT-145).\nBR-CO-8: Reason code (BT-145) and reason text (BT-144) of a line charge must say the same.\nBR-CO-24: Each charge on a line (BG-28) needs a reason text (BT-144), a reason code (BT-145) or both.
BT-145.name=Invoice line charge reason code
BT-145.card=0..1
BT-145.type=code
BT-145.use=The reason for the charge as code.
BT-145.note=Codes of UNTDID 7161. Code and text (BT-144) must say the same.
BT-145.rules=BR-44: Each charge on a line (BG-28) needs a reason, as text (BT-144) or code (BT-145).\nBR-CO-8: Reason code (BT-145) and reason text (BT-144) of a line charge must say the same.\nBR-CO-24: Each charge on a line (BG-28) needs a reason text (BT-144), a reason code (BT-145) or both.
BG-29.name=PRICE DETAILS
BG-29.card=1..1
BG-29.use=The price of the item of this line.
BT-146.name=Item net price
BT-146.card=1..1
BT-146.type=unitPrice
BT-146.use=The price per unit without VAT, after the price discount.
BT-146.note=Gross price (BT-148) minus price discount (BT-147).
BT-146.rules=BR-26: Each line (BG-25) needs a net price (BT-146).\nBR-27: The net price (BT-146) must not be negative.
BT-147.name=Item price discount
BT-147.card=0..1
BT-147.type=unitPrice
BT-147.use=The discount per unit that is subtracted from the gross price.
BT-147.note=Only if the discount is given per unit and is not already in the gross price.
BT-148.name=Item gross price
BT-148.card=0..1
BT-148.type=unitPrice
BT-148.use=The price per unit without VAT, before the price discount (list price).
BT-148.rules=BR-28: The gross price (BT-148) must not be negative.
BT-149.name=Item price base quantity
BT-149.card=0..1
BT-149.type=quantity
BT-149.attributes=BT-150
BT-149.use=The number of units the price refers to, e.g. 100 for a price per 100 pieces.
BT-150.name=Item price base quantity unit of measure code
BT-150.card=0..1
BT-150.type=code
BT-150.use=The unit of this base quantity.
BT-150.note=Must be the same unit as the invoiced quantity (BT-130).
BG-30.name=LINE VAT INFORMATION
BG-30.card=1..1
BG-30.use=The VAT of the item of this line.
BT-151.name=Invoiced item VAT category code
BT-151.card=1..1
BT-151.type=code
BT-151.use=The VAT category of the item, e.g. S for standard rate.
BT-151.note=S standard rate, Z zero rate, E exempt, AE reverse charge, K intra-community supply, G export outside the EU, O not subject to VAT, L Canary Islands (IGIC), M Ceuta and Melilla (IPSI).
BT-151.rules=BR-CO-4: Each line (BG-25) needs a VAT category (BT-151).\nBR-S-1: If a line, allowance or charge has VAT category S (standard rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category S (BT-118).\nBR-S-2: If a line (BT-151) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-S-5: With category S (standard rate) the VAT rate of the line (BT-152) must be greater than 0.\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-Z-1: If a line, allowance or charge has VAT category Z (zero rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category Z (BT-118).\nBR-Z-2: If a line (BT-151) has category Z (zero rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-Z-5: With category Z (zero rate) the VAT rate of the line (BT-152) must be 0.\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-1: If a line, allowance or charge has VAT category E (exempt) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category E (BT-118).\nBR-E-2: If a line (BT-151) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-5: With category E (exempt) the VAT rate of the line (BT-152) must be 0.\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-1: If a line, allowance or charge has VAT category AE (reverse charge) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category AE (BT-118).\nBR-AE-2: If a line (BT-151) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-AE-5: With category AE (reverse charge) the VAT rate of the line (BT-152) must be 0.\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-1: If a line, allowance or charge has VAT category K (intra-community supply) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category K (BT-118).\nBR-IC-2: If a line (BT-151) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-IC-5: With category K (intra-community supply) the VAT rate of the line (BT-152) must be 0.\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-1: If a line, allowance or charge has VAT category G (export outside the EU) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category G (BT-118).\nBR-G-2: If a line (BT-151) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-G-5: With category G (export outside the EU) the VAT rate of the line (BT-152) must be 0.\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-1: If a line, allowance or charge has VAT category O (not subject to VAT) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category O (BT-118).\nBR-O-2: If a line (BT-151) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-O-5: With category O (not subject to VAT) the line has no VAT rate (BT-152).\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-12: With category O (not subject to VAT) all lines must have category O (BT-151).\nBR-IG-1: If a line, allowance or charge has VAT category L (IGIC, Canary Islands) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category L (BT-118).\nBR-IG-2: If a line (BT-151) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IG-5: With category L (IGIC, Canary Islands) the VAT rate of the line (BT-152) must be 0 or more.\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-1: If a line, allowance or charge has VAT category M (IPSI, Ceuta and Melilla) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category M (BT-118).\nBR-IP-2: If a line (BT-151) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-5: With category M (IPSI, Ceuta and Melilla) the VAT rate of the line (BT-152) must be 0 or more.\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).
BT-152.name=Invoiced item VAT rate
BT-152.card=0..1
BT-152.type=percentage
BT-152.use=The VAT rate of the item in percent, e.g. 19.
BT-152.rules=BR-S-5: With category S (standard rate) the VAT rate of the line (BT-152) must be greater than 0.\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-Z-5: With category Z (zero rate) the VAT rate of the line (BT-152) must be 0.\nBR-E-5: With category E (exempt) the VAT rate of the line (BT-152) must be 0.\nBR-AE-5: With category AE (reverse charge) the VAT rate of the line (BT-152) must be 0.\nBR-IC-5: With category K (intra-community supply) the VAT rate of the line (BT-152) must be 0.\nBR-G-5: With category G (export outside the EU) the VAT rate of the line (BT-152) must be 0.\nBR-O-5: With category O (not subject to VAT) the line has no VAT rate (BT-152).\nBR-IG-5: With category L (IGIC, Canary Islands) the VAT rate of the line (BT-152) must be 0 or more.\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-5: With category M (IPSI, Ceuta and Melilla) the VAT rate of the line (BT-152) must be 0 or more.\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).
BG-31.name=ITEM INFORMATION
BG-31.card=1..1
BG-31.use=Information about the goods or services of this line.
BT-153.name=Item name
BT-153.card=1..1
BT-153.type=text
BT-153.use=The name of the item.
BT-153.rules=BR-25: Each line (BG-25) needs an item name (BT-153).
BT-154.name=Item description
BT-154.card=0..1
BT-154.type=text
BT-154.use=A description of the item.
BT-154.note=For more detail than the name allows.
BT-155.name=Item Seller's identifier
BT-155.card=0..1
BT-155.type=identifier
BT-155.use=Your article number of the item.
BT-156.name=Item Buyer's identifier
BT-156.card=0..1
BT-156.type=identifier
BT-156.use=The buyer's article number of the item.
BT-157.name=Item standard identifier
BT-157.card=0..1
BT-157.type=identifier
BT-157.attributes=BT-157-1
BT-157.use=A standard article number, e.g. a GTIN (EAN).
BT-157.rules=BR-64: A standard article number (BT-157) needs a scheme (e.g. 0160 for GTIN).
BT-157-1.name=Scheme identifier
BT-157-1.card=1..1
BT-157-1.use=The kind of the standard article number (BT-157), e.g. 0160 for a GTIN.
BT-157-1.note=Choose it from the ISO/IEC 6523 list.
BT-158.name=Item classification identifier
BT-158.card=0..n
BT-158.type=identifier
BT-158.attributes=BT-158-1,BT-158-2
BT-158.use=A classification of the item by type or nature.
BT-158.note=Groups similar items, e.g. CPV codes for public procurement or UNSPSC for e-commerce.
BT-158.rules=BR-65: An item classification (BT-158) needs a scheme (the classification system).
BT-158-1.name=Scheme identifier
BT-158-1.card=1..1
BT-158-1.use=The classification system of BT-158, e.g. STI for CPV.
BT-158-1.note=Codes of UNTDID 7143.
BT-158-2.name=Scheme version identifier
BT-158-2.card=0..1
BT-158-2.use=The version of the classification system.
BT-159.name=Item country of origin
BT-159.card=0..1
BT-159.type=code
BT-159.use=The country the goods come from, as code, e.g. DE.
BT-159.note=Codes of ISO 3166-1.
BG-32.name=ITEM ATTRIBUTES
BG-32.card=0..n
BG-32.use=Properties of the item, e.g. colour or size.
BT-160.name=Item attribute name
BT-160.card=1..1
BT-160.type=text
BT-160.use=The name of the property.
BT-160.note=E.g. "Colour".
BT-160.rules=BR-54: Each item property (BG-32) needs a name (BT-160) and a value (BT-161).
BT-161.name=Item attribute value
BT-161.card=1..1
BT-161.type=text
BT-161.use=The value of the property.
BT-161.note=E.g. "Red".
BT-161.rules=BR-54: Each item property (BG-32) needs a name (BT-160) and a value (BT-161).
