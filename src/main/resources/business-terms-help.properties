BT-18.name=Invoiced object identifier
BT-18.card=0..1
BT-18.type=identifier
BT-18.attributes=BT-18-1
BT-18.use=The object the invoice is about.
BT-18.note=E.g. a subscription, phone or meter number, a vehicle or a person.
BT-18-1.name=Scheme identifier
BT-18-1.card=0..1
BT-18-1.use=Says what kind of identifier the object identifier (BT-18) is.
BT-18-1.note=Only needed if that is not clear to the receiver. Choose a code of UNTDID 1153.
BT-19.name=Buyer accounting reference
BT-19.card=0..1
BT-19.type=text
BT-19.use=Where the buyer books the invoice, e.g. a cost centre or account.
BT-20.name=Payment terms
BT-20.card=0..1
BT-20.type=text
BT-20.use=The payment terms as text, e.g. discounts or late fees.
BT-20.note=May contain several lines and terms.
BT-20.rules=BR-CO-25: If an amount is due (BT-115), give a due date (BT-9) or payment terms (BT-20).
BG-1.name=INVOICE NOTE
BG-1.card=0..n
