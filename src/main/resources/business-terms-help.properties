BT-21.name=Invoice note subject code
BT-21.card=0..1
BT-21.type=code
BT-21.use=The subject of the note (BT-22), as a code.
BT-21.note=Choose a code of UNTDID 4451.
BT-22.name=Invoice note
BT-22.card=1..1
BT-22.type=text
BT-22.use=A free text note for the whole invoice.
BT-22.note=E.g. the reason for a correction, or an assignment note if the invoice was sold to a factoring company.
BG-2.name=PROCESS CONTROL
BG-2.card=1..1
BG-2.use=Information on the business process and the rules the invoice follows.
BT-23.name=Business process type
BT-23.card=0..1
BT-23.type=text
BT-23.use=The business process the invoice belongs to, so the buyer can process it correctly.
BT-23.note=The buyer tells you what to enter.
BT-24.name=Specification identifier
BT-24.card=1..1
BT-24.type=identifier
BT-24.use=The specification the invoice follows, e.g. the profile of ZUGFeRD / Factur-X or XRechnung.
BT-24.note=Set by the program from the chosen profile. For EN 16931 it is "urn:cen.eu:en16931:2017".
BT-24.rules=BR-1: The invoice needs a specification identifier (BT-24).
BG-3.name=PRECEDING INVOICE REFERENCE
BG-3.card=0..n
BG-3.use=References to earlier invoices.
BG-3.note=Use it when you correct an invoice, or when a final invoice refers to partial or advance invoices.
BT-25.name=Preceding Invoice reference
BT-25.card=1..1
BT-25.type=reference
BT-25.use=The number of the earlier invoice.
BT-25.rules=BR-55: Each reference to an earlier invoice (BG-3) needs its number (BT-25).
BT-26.name=Preceding Invoice issue date
BT-26.card=0..1
BT-26.type=date
BT-26.use=The date of the earlier invoice.
BT-26.note=Give it if the number alone is not unique.
BG-4.name=SELLER
BG-4.card=1..1
BG-4.use=Information about the seller (you).
BT-27.name=Seller name
BT-27.card=1..1
BT-27.type=text
