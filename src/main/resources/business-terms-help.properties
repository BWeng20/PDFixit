BT-63.rules=BR-56: A tax representative (BG-11) needs a VAT ID (BT-63).\nBR-CO-9: VAT IDs (BT-31, BT-48, BT-63) start with the country code, e.g. DE; Greece uses EL.\nBR-S-2: If a line (BT-151) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-S-3: If an invoice allowance (BT-95) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-S-4: If an invoice charge (BT-102) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-Z-2: If a line (BT-151) has category Z (zero rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-Z-3: If an invoice allowance (BT-95) has category Z (zero rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-Z-4: If an invoice charge (BT-102) has category Z (zero rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-2: If a line (BT-151) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-3: If an invoice allowance (BT-95) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-4: If an invoice charge (BT-102) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-AE-2: If a line (BT-151) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-AE-3: If an invoice allowance (BT-95) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-AE-4: If an invoice charge (BT-102) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-IC-2: If a line (BT-151) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-IC-3: If an invoice allowance (BT-95) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-IC-4: If an invoice charge (BT-102) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-G-2: If a line (BT-151) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-G-3: If an invoice allowance (BT-95) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-G-4: If an invoice charge (BT-102) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-O-2: If a line (BT-151) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-O-3: If an invoice allowance (BT-95) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-O-4: If an invoice charge (BT-102) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-IG-2: If a line (BT-151) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IG-3: If an invoice allowance (BT-95) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IG-4: If an invoice charge (BT-102) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-2: If a line (BT-151) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-3: If an invoice allowance (BT-95) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-4: If an invoice charge (BT-102) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).
