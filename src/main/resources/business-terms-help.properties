BT-28.name=Seller trading name
BT-28.card=0..1
BT-28.type=text
BT-28.use=The name you trade under, if different from your legal name.
BT-28.note=Only if it differs from the seller name.
BT-29.name=Seller identifier
BT-29.card=0..n
BT-29.type=identifier
BT-29.attributes=BT-29-1
BT-29.use=An identifier of you as seller, e.g. a GLN or the supplier number the buyer gave you.
BT-29.note=You may give several. Without a scheme (BT-29-1) the buyer must know what it means. With a scheme, choose it from the ISO/IEC 6523 list.
