BT-1.name=Invoice number
BT-1.card=1..1
BT-1.type=identifier
BT-1.use=The number of the invoice.
BT-1.note=Use a sequential number that you never use twice. Letters are allowed, e.g. "2026-0042".
BT-1.rules=BR-2: The invoice needs an invoice number (BT-1).
BT-2.name=Invoice issue date
BT-2.card=1..1
BT-2.type=date
BT-2.use=The date the invoice is issued.
BT-2.rules=BR-3: The invoice needs an invoice date (BT-2).
BT-3.name=Invoice type code
BT-3.card=1..1
BT-3.type=code
BT-3.use=The kind of invoice, e.g. 380 for an invoice or 381 for a credit note.
BT-3.note=Choose a code of the list UNTDID 1001. Usually 380 (commercial invoice).
BT-3.rules=BR-4: The invoice needs an invoice type code (BT-3).
BT-5.name=Invoice currency code
BT-5.card=1..1
BT-5.type=code
BT-5.use=The currency of all amounts of the invoice, e.g. EUR.
BT-5.note=An invoice has only one currency. Only the VAT total in accounting currency (BT-111) may use another one.
BT-5.rules=BR-5: The invoice needs a currency (BT-5).
BT-6.name=VAT accounting currency code
BT-6.card=0..1
BT-6.type=code
BT-6.use=The currency in which the VAT is accounted in the seller's country, if it differs from the invoice currency.
BT-6.note=Only needed if the VAT has to be reported in another currency. Then also give the VAT total in that currency (BT-111).
BT-7.name=Value added tax point date
BT-7.card=0..1
BT-7.type=date
BT-7.use=The date on which the VAT becomes due, if it differs from the invoice date.
BT-7.note=Usually the date of delivery or of the completed service. Use either this date or its code (BT-8), not both.
BT-7.rules=BR-CO-3: Give either the VAT date (BT-7) or its code (BT-8), not both.
BT-8.name=Value added tax point date code
BT-8.card=0..1
BT-8.type=code
BT-8.use=Says which date the VAT is due on, as a code, if the date itself is not yet known.
BT-8.note=Possible: the invoice date, the delivery date or the payment date (codes of UNTDID 2005). Use either this code or the date (BT-7), not both.
BT-8.rules=BR-CO-3: Give either the VAT date (BT-7) or its code (BT-8), not both.
BT-9.name=Payment due date
BT-9.card=0..1
BT-9.type=date
BT-9.use=The date by which the invoice has to be paid.
BT-9.note=For partial payments the first due date. More complex terms can be described in the payment terms (BT-20).
BT-9.rules=BR-CO-25: If an amount is due (BT-115), give a due date (BT-9) or payment terms (BT-20).
BT-10.name=Buyer reference
BT-10.card=0..1
BT-10.type=text
BT-10.use=A reference the buyer gave you to route the invoice internally.
BT-10.note=E.g. a department, contact or project code. In Germany the Leitweg-ID for public buyers goes here.
BT-11.name=Project reference
BT-11.card=0..1
BT-11.type=reference
BT-11.use=The project the invoice belongs to.
BT-12.name=Contract reference
BT-12.card=0..1
BT-12.type=reference
BT-12.use=The number of the contract.
BT-12.note=Should be unique within your business relationship with the buyer.
BT-13.name=Purchase order reference
BT-13.card=0..1
BT-13.type=reference
BT-13.use=The buyer's order number.
BT-14.name=Sales order reference
BT-14.card=0..1
BT-14.type=reference
BT-14.use=Your own order number (sales order).
BT-15.name=Receiving advice reference
BT-15.card=0..1
BT-15.type=reference
BT-15.use=The number of the buyer's goods receipt note.
BT-16.name=Despatch advice reference
BT-16.card=0..1
BT-16.type=reference
BT-16.use=The number of the despatch advice (delivery note).
BT-17.name=Tender or lot reference
BT-17.card=0..1
