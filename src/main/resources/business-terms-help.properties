BG-20.rules=BR-S-1: If a line, allowance or charge has VAT category S (standard rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category S (BT-118).\nBR-S-3: If an invoice allowance (BT-95) has category S (standard rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-S-6: With category S (standard rate) the VAT rate of the invoice allowance (BT-96) must be greater than 0.\nBR-Z-1: If a line, allowance or charge has VAT category Z (zero rate) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category Z (BT-118).\nBR-Z-3: If an invoice allowance (BT-95) has category Z (zero rate), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-Z-6: With category Z (zero rate) the VAT rate of the invoice allowance (BT-96) must be 0.\nBR-E-1: If a line, allowance or charge has VAT category E (exempt) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category E (BT-118).\nBR-E-3: If an invoice allowance (BT-95) has category E (exempt), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-E-6: With category E (exempt) the VAT rate of the invoice allowance (BT-96) must be 0.\nBR-AE-1: If a line, allowance or charge has VAT category AE (reverse charge) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category AE (BT-118).\nBR-AE-3: If an invoice allowance (BT-95) has category AE (reverse charge), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48) or registration number (BT-47).\nBR-AE-6: With category AE (reverse charge) the VAT rate of the invoice allowance (BT-96) must be 0.\nBR-IC-1: If a line, allowance or charge has VAT category K (intra-community supply) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category K (BT-118).\nBR-IC-3: If an invoice allowance (BT-95) has category K (intra-community supply), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63), and the buyer's VAT ID (BT-48).\nBR-IC-6: With category K (intra-community supply) the VAT rate of the invoice allowance (BT-96) must be 0.\nBR-G-1: If a line, allowance or charge has VAT category G (export outside the EU) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category G (BT-118).\nBR-G-3: If an invoice allowance (BT-95) has category G (export outside the EU), give your VAT ID (BT-31) or the VAT ID of your tax representative (BT-63).\nBR-G-6: With category G (export outside the EU) the VAT rate of the invoice allowance (BT-96) must be 0.\nBR-O-1: If a line, allowance or charge has VAT category O (not subject to VAT) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs exactly one entry with category O (BT-118).\nBR-O-3: If an invoice allowance (BT-95) has category O (not subject to VAT), do not give VAT IDs (BT-31, BT-63, BT-48).\nBR-O-6: With category O (not subject to VAT) the invoice allowance has no VAT rate (BT-96).\nBR-O-13: With category O (not subject to VAT) all invoice allowances must have category O (BT-95).\nBR-IG-1: If a line, allowance or charge has VAT category L (IGIC, Canary Islands) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category L (BT-118).\nBR-IG-3: If an invoice allowance (BT-95) has category L (IGIC, Canary Islands), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IG-6: With category L (IGIC, Canary Islands) the VAT rate of the invoice allowance (BT-96) must be 0 or more.\nBR-IP-1: If a line, allowance or charge has VAT category M (IPSI, Ceuta and Melilla) (BT-151, BT-95, BT-102), the VAT breakdown (BG-23) needs an entry with category M (BT-118).\nBR-IP-3: If an invoice allowance (BT-95) has category M (IPSI, Ceuta and Melilla), give your VAT ID (BT-31), your tax number (BT-32) or the VAT ID of your tax representative (BT-63).\nBR-IP-6: With category M (IPSI, Ceuta and Melilla) the VAT rate of the invoice allowance (BT-96) must be 0 or more.
