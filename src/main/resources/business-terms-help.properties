BT-92.rules=BR-31: Each allowance on the invoice (BG-20) needs an amount (BT-92).\nBR-S-8: For each rate of category S (standard rate), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-Z-8: For category Z (zero rate): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-E-8: For category E (exempt): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-AE-8: For category AE (reverse charge): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IC-8: For category K (intra-community supply): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-G-8: For category G (export outside the EU): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-O-8: For category O (not subject to VAT): taxable amount (BT-116) = sum of the lines (BT-131) − allowances (BT-92) + charges (BT-99) with this category.\nBR-IG-8: For each rate of category L (IGIC, Canary Islands), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).\nBR-IP-8: For each rate of category M (IPSI, Ceuta and Melilla), the taxable amount (BT-116) = sum of the lines (BT-131) + charges (BT-99) − allowances (BT-92) with this category and rate (BT-152, BT-103, BT-96).
