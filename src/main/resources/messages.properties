cli.canModifyAnnotations=User shall be able to modify annotations.
cli.help=Display this help message and exit.
cli.merge=Zipper merge instead of append. '5-2-3' will start before page 5 of the current document, inserts 2 pages of the new document, then skip 3 pages, then inserts again 2 pages, skip again 3 e.t.c. until all new pages are added.
cli.certificate=Signs the resulting PDF with a certificate from a p12 file.
cli.certificatePassword=Password for the certificate.
cli.redactText=Permanently removes all text matching the regular expression. The affected pages are converted to images.
cli.redactArea=Permanently removes an area. Values in points (1/72 inch) from the upper left corner of the page, e.g. '1:50,100,200,20'. The affected pages are converted to images.
cli.attachInvoice=Attaches an invoice (ZUGFeRD/Factur-X, CII syntax) to the resulting PDF. An existing invoice is replaced. The result is only valid if the PDF is PDF/A-3 compliant, use '-vi' to check that.
cli.extractInvoice=Writes the invoice (ZUGFeRD/Factur-X) of the loaded document to a file.
cli.removeInvoice=Removes the invoice from the document. Required if you redact a document that contains an invoice.
cli.validateInvoice=Validates the resulting PDF and its invoice (PDF/A-3 and EN 16931). Can't be combined with '--split'.
cli.validatePdfa=Validates the resulting PDF with veraPDF against the PDF/A flavour it declares (a PDF without declaration is reported as such). Can't be combined with '--split'.
cli.debug=Shows debug output and stack traces. Also possible with the system property 'pdfixit.debug=true'. Can be used together with file names to start the UI in debug mode.
