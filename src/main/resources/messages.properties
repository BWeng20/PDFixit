cli.generateInvoice=Generates an e-invoice: renders the invoice XML (CII) on the letterhead given by '--template' (the layout is found beside the template or in the layout folder of the program, see '--layout'), attaches the XML and writes the result to '--out'. Needs no input PDF. Can only be combined with the options of the invoice generation.
cli.template=The letterhead PDF for '--generateInvoice'. A plain PDF without any marks; it is never changed.
cli.layout=A layout file (JSON) for '--generateInvoice' instead of the one found for the template. Without any layout file the DIN 5008 defaults apply.
cli.continuation=The source of the following pages of a long invoice, if the layout has none: 'template' (page 2 of the template), 'page1' (page 1 again), 'blank' (empty pages) or the name of a PDF file whose first page is used. The layout file is not changed. Without it a long invoice on a one-page template is an error.
cli.pdfaLevel=The PDF/A-3 level of the generated invoice: a, b or u. Default: the setting of the e-invoice wizard (u if none).
cli.language=The language of the printed invoice: de or en. Default: the setting of the e-invoice wizard, otherwise the language of the program.
cli.generate.noXml=The options of the invoice generation need '--generateInvoice <xml file>'.
