redact.help.text=<html><font size='+2'><b>How Redaction Works</b></font><br><br><font size='+1'>Simply drawing a black box over text doesn't remove it: the text is still in the file<br>and can be copied or extracted. This tool therefore works differently:<ol><li>Each page with marked areas is <b>rendered to an image</b> (resolution from<br><i>Options / Render Quality</i>).</li><li>The marked areas are <b>painted</b> into that image with the selected color.</li><li>The original page is <b>replaced</b> by the image.</li></ol>All text, vector graphics and images of a redacted page are really gone - not only<br>what is below the boxes. Pages without marked areas are not changed.<br><br><b>Consequences for redacted pages:</b><ul><li>Text can no longer be selected or searched (no OCR is done).</li><li>Links, comments and form fields on the page are dropped.</li><li>The file gets bigger, depending on the resolution.</li></ul><b>Not removed</b> - check these yourself:<ul><li>Bookmarks (outline) and document information (title, author, ...) and XMP metadata.</li><li>Attached files. An e-invoice is detected, you are asked what to do with it.</li><li>Values of form fields: they are stored outside the page.</li></ul><b>Text search</b> only finds real text. Text inside images (e.g. scanned pages)<br>is not found, mark such areas with the mouse.</font></html>
