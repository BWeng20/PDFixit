help.wizard.invoice.text=<html><font size='+2'><b>E-Invoice Wizard</b></font><br><br><font size='+1'>The wizard creates an e-invoice (ZUGFeRD / Factur-X): the invoice is printed on your letterhead, and the same data is attached to the PDF as XML.<br><br>The steps on the left show where you are. <i><b>Next</b></i> is available when nothing is missing in a step; the line above the buttons names the first problem.<br><br><b>1 Goal:</b> a new invoice on a letterhead template, an invoice added to an existing PDF (the pages stay as they are), or a start from an invoice XML file. Here you also choose the document type and the profile. Not every profile is accepted as an e-invoice in every country, please check which ones are legal for you.<br><br><b>2 Seller, 3 Buyer, 4 Items, 5 Payment:</b> the invoice data. Sellers and buyers can be saved and chosen again.<br><br><b>6 Template:</b> the letterhead, a plain PDF without any marks. The last five templates are offered in the list. The layout file beside the PDF (or in the folder .pdfixit/layouts of your user folder) says where the fields go; without one the DIN 5008 positions are used. <i><b>Edit layout...</b></i> opens the layout editor.<br><br><b>7 Review:</b> the invoice is generated and checked (EN 16931 and PDF/A-3). Problems are listed with a link to the step or to the layout editor that fixes them. You also choose the PDF/A level (u, b or a) and the language of the printed invoice here. If the invoice needs more than one page and the template has one, you are asked where the following pages come from.<br><br><i><b>Finish</b></i> opens the invoice as the current document. It is not saved yet.</font></html>
help.layoutEditor.text=<html><font size='+2'><b>Layout Editor</b></font><br><br><font size='+1'>The layout says where the invoice is printed on your letterhead. The letterhead itself is never changed; the layout is saved as a small file beside the PDF (or in the folder .pdfixit/layouts of your user folder if the folder of the PDF is not writable), and the editor tells you where.<br><br>The page of the letterhead is shown with the regions of the elements. Drag a region to move it, drag its handles to resize it. The list on the left holds the elements: the fields of the invoice, the address blocks, the closing text and pictures. A <b>fixed</b> element has a region on page 1 or on the following pages. Elements of the <b>body</b> have no region of their own: they are printed one after the other in the body region and move with the content above them, in the order of the list.<br><br>The engine prints a <b>label</b> before each value. A label can be moved, switched off (Delete) or switched on again with its default text. A text and a picture (for instance a signature) can be added; the picture is stored in the layout file, so everyone who gets that file can see it.<br><br><b>Sample data</b> shows the effect with a made-up invoice. The warnings below tell if a region contains text of the letterhead, leaves the page, or is too small for a value. Graphics of the letterhead are not detected, the preview shows them.<br><br><b>Following pages:</b> page 2 of the template, page 1 again, another PDF or an empty page. <b>Reset to DIN 5008</b> places everything as in the standard (form A or B).</font></html>
