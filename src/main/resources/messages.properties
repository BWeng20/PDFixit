help.invoice.text=<html><font size='+2'><b>E-Invoices (ZUGFeRD / Factur-X)</b></font><br><br><font size='+1'>An e-invoice is a PDF/A-3 document with embedded invoice data in XML format.<br>This way the invoice can be read by people as well as processed automatically by programs.<br><br>The editor in this tab is used to create and edit the invoice of the current document.<br>Your changes remain a draft at first and are only transferred to the document with <i><b>Apply to document</b></i> (in the bar at the bottom of the tab).<br>The invoice is checked and embedded as an XML file. An existing invoice is replaced, not added a second time.<br>Invalid invoices cannot be applied. When the document is saved, the applied invoice data is saved as well.<br><br>Only the invoice data is changed, <b>not the visible pages of the PDF document</b>.<br><br>The mark <b>Modified</b> in the corner of the editor shows that the content of the editor differs from the invoice stored in the document.<br>Use <b>Discard changes</b> to reset the editor to the current state of the document.<br><br>The box <b>Invoice in the document</b> shows whether the document contains a valid e-invoice.<br>When the document is loaded or changed, the invoice is checked automatically against the PDF/A-3 requirements and the European standard EN 16931.<br>This check never changes the document.<br>Use <b>Details</b> to show all messages and the full report.<br><br><b>Profile:</b> The profile decides which data the invoice contains. Not every profile is accepted as a legally valid e-invoice in every country.<br>In particular the profiles <b>Minimum</b> and <b>Basic WL</b> often do not meet the requirements for electronic invoicing.<br><b>Please check which profiles are permitted in your case.</b></font></html>

