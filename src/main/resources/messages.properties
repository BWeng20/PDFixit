help.permissions.text=<html><font size='+2'><b>How to set PDF Permissions</b></font><br><font size='+1'>To prevent unauthorized access to a PDF, you only need to set a <b>user password</b>.<br>The user password is required to open the document.<br><br>If you want to define specific permissions - such as restricting printing or<br>editing - you must set an <b>owner password</b>.<br>The <b>owner password</b> always grants full control over the document,<br>but is not required to open the document.<br>If a document with an owner password set is opened without this password,<br>the permissions you selected are enforced. Tools will normally not prompt for it.<br><br>Most tools that set permissions use a hidden, automatically generated owner password to prevent<br>users from gaining full access.<br><br>If you use the same password for both the user and owner passwords, the restrictions will<br>have no effect, as the single entered password will satisfy the <b>owner password</b> requirement,<br>thereby unlocking the document with full owner rights.<br><br><b>Reminder:</b> The <i>Annotations</i> permission covers forms, comments, and signing.</font></html>
ui.border.signing=Signing
help.signing.text=<html><font size='+2'><b>How to Sign a PDF</b></font><br><br><font size='+1'>Signing requires a <b>P12 key file</b> which contain a <b>X.509 certificate</b><br>with the following components:<br><ul><li><b>Private Key:</b> This is essential to generate the digital signature.<br>It proves your identity.</li><li><b>Certificate Chain:</b> This is a series of certificates that links your<br>certificate back to a trusted Root Certificate Authority (CA).</li><li><b>Common Name (CN):</b> This attribute is used to identify the signer and<br>is typically displayed as the signer's name in the viewer.</li></ul><br>For your signature to be accepted by the recipient's system, the certificate<br>chain must ultimately be based on a Root Certificate Authority (CA) that is<br>already installed and trusted by the target system.<br><br><b>Options for Certificates:</b><ul><li><b>Purchased Certificates:</b><br>You can buy certificates from commercial CAs (like DigiCert, Comodo, etc.)<br>whose roots are widely trusted.</li><br><li><b>Self-Signed Certificates</b>:<br>You can create your own.<br>However, for these signatures to be verified, you must distribute the public<br>part of your self-signed certificate to the people you are sharing the PDF with,<br>and they must manually add it to their list of trusted identities.<br></font></html>
