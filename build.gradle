plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

group = 'io.github.bweng20'
version = '3.1'


repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.14.4'
    picocliVersion = '4.7.7'
    mustangVersion = '2.26.0'
    // Keep in sync with the version Mustang uses (see 'gradlew dependencies'), otherwise Gradle silently upgrades.
    pdfboxVersion = '3.0.8'
    verapdfVersion = '1.30.2'
}

java {
    modularity.inferModulePath = true
}

// The code needs Java 17 (records, pattern matching). Fix the byte code level, independent of the JDK used to build.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    // The sources are UTF-8. Without this, javac before JDK 18 uses the platform encoding (cp1252 on Windows)
    // and texts like "Color…" are garbled.
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {

    implementation "com.formdev:flatlaf:3.7.2"
    implementation "com.formdev:flatlaf-fonts-roboto:2.137"
    implementation "io.github.bweng20:jSVGIcon:1.6"

    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"
    implementation "org.apache.pdfbox:fontbox:${pdfboxVersion}"
    // Version used by PDFBox, otherwise Gradle silently upgrades.
    implementation 'commons-logging:commons-logging:1.4.0'

    implementation "org.mustangproject:library:${mustangVersion}"
    implementation "org.mustangproject:validator:${mustangVersion}"
    // veraPDF is used directly (PdfaValidator), not only through the Mustang validator. Version used by Mustang,
    // otherwise Gradle silently upgrades.
    implementation "org.verapdf:core-jakarta:${verapdfVersion}"
    implementation "org.verapdf:validation-model-jakarta:${verapdfVersion}"
    implementation "org.verapdf:metadata-fixer-jakarta:${verapdfVersion}"
    implementation "org.verapdf:feature-reporting-jakarta:${verapdfVersion}"
    implementation 'org.slf4j:slf4j-nop:2.0.20'
    // Seller presets (sellers.json). Version used by Mustang, otherwise Gradle silently upgrades.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    implementation("info.picocli:picocli:${picocliVersion}")
    annotationProcessor("info.picocli:picocli-codegen:${picocliVersion}")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    // Gradle 8 brings an older launcher, which doesn't match the engine of JUnit 5.14.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.4"
}

// The version of this file is the only place with the version number: it is written into a Java class (BuildVersion)
// before compiling, together with the build date and the libraries the tool uses.
def versionSourceDir = layout.buildDirectory.dir('generated/sources/version/java')

tasks.register('generateVersion') {
    def outputDir = versionSourceDir
    def versionText = project.version.toString()
    def buildDate = java.time.LocalDate.now().toString()
    def runtime = configurations.runtimeClasspath
    inputs.property('version', versionText)
    inputs.property('buildDate', buildDate)
    inputs.files(runtime)
    outputs.dir(outputDir)
    def licenseFileProvider = layout.buildDirectory.file('licenses/THIRD-PARTY-LICENSES.txt')
    outputs.file(licenseFileProvider)
    doLast {
        // All libraries of the runtime classpath (direct and transitive), e.g. "org.apache.pdfbox:pdfbox:3.0.8",
        // with the license declared in their POM (or a parent POM) as "name|url", in the same order.
        def modules = new TreeMap<String, String>()
        runtime.resolvedConfiguration.resolvedArtifacts.each {
            def id = it.moduleVersion.id
            modules.put("${id.group}:${id.name}".toString(), id.version)
        }
        // The POM comes from the Gradle cache (it was downloaded for the dependency resolution), so this works offline.
        def pomFile = { String g, String a, String v ->
            def result = project.dependencies.createArtifactResolutionQuery()
                    .forModule(g, a, v)
                    .withArtifacts(org.gradle.maven.MavenModule, org.gradle.maven.MavenPomArtifact)
                    .execute()
            def pom = result.resolvedComponents.collectMany { it.getArtifacts(org.gradle.maven.MavenPomArtifact) }
                    .findAll { it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult }
                    .collect { it.file }.find()
            if (pom == null)
                logger.warn("No POM for {}:{}:{}", g, a, v)
            return pom
        }
        def readLicenses
        readLicenses = { String g, String a, String v, int depth ->
            def pom = pomFile(g, a, v)
            if (pom == null)
                return []
            def xml = new groovy.xml.XmlSlurper(false, false).parse(pom)
            def found = xml.licenses.license.collect { [it.name.text().trim().replaceAll('\\s+', ' '), it.url.text().trim()] }
            if (!found.isEmpty() || depth > 5 || xml.parent.size() == 0)
                return found
            return readLicenses(xml.parent.groupId.text().trim(), xml.parent.artifactId.text().trim(),
                    xml.parent.version.text().trim(), depth + 1)
        }
        def quote = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }
        def libraries = []
        def licenses = []
        modules.each { key, version ->
            def (g, a) = key.split(':')
            def found = readLicenses(g, a, version, 0)
            libraries << "${key}:${version}".toString()
            licenses << (found.isEmpty() ? '|' : found.collect { it[0] }.join(' or ') + '|' + found[0][1])
        }
        def libraryLines = libraries.collect { '            ' + quote(it) }.join(',\n')
        def licenseLines = licenses.collect { '            ' + quote(it) }.join(',\n')
        def file = outputDir.get().file('com/bw/pdfixit/BuildVersion.java').asFile
        file.parentFile.mkdirs()
        file.text = """package com.bw.pdfixit;

/**
 * Version, build date, libraries and their licenses of the tool, written by the Gradle task generateVersion. Do not edit.
 */
public final class BuildVersion {

    public static final String VERSION = "${versionText}";

    /**
     * Day of the build, "yyyy-MM-dd".
     */
    public static final String BUILD_DATE = "${buildDate}";

    /**
     * All libraries of the runtime classpath (direct and transitive) as "group:name:version", sorted.
     */
    public static final String[] LIBRARIES = {
${libraryLines}
    };

    /**
     * The license of each library in LIBRARIES (same index) as "name|url", declared in the POM of the library.
     * Both parts are empty if the POM declares none.
     */
    public static final String[] LICENSES = {
${licenseLines}
    };

    private BuildVersion() {
    }
}
"""
        // The license overview for the distribution (MPL 2.0 asks to tell the recipients where the source is).
        def lines = []
        lines << "Third-party components of PDFixit ${versionText}"
        lines << ''
        lines << 'Licenses as declared in the POM of each library (generated by the build).'
        lines << ''
        lines << 'veraPDF (org.verapdf:*) is dual-licensed under GPL-3.0 or MPL-2.0. PDFixit uses it under the'
        lines << 'Mozilla Public License 2.0 (https://www.mozilla.org/MPL/2.0/). PDFixit does not modify veraPDF.'
        lines << 'The source code of veraPDF is available at https://github.com/veraPDF/veraPDF-library'
        lines << ''
        libraries.eachWithIndex { lib, i ->
            def parts = licenses[i].split('[|]', -1)
            lines << lib
            lines << "    ${parts[0] ?: 'unknown'}" + (parts.length > 1 && parts[1] ? " (${parts[1]})" : '')
        }
        lines << ''
        lines << 'Arimo, Tinos, Cousine (fonts, embedded into PDF/A documents): Apache License 2.0'
        def licenseFile = licenseFileProvider.get().asFile
        licenseFile.parentFile.mkdirs()
        licenseFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

sourceSets.main.java.srcDir(versionSourceDir)
tasks.named('compileJava') {
    dependsOn 'generateVersion'
}

// The license is shown in the About dialog.
processResources {
    from(layout.projectDirectory.file('LICENSE'))
}

test {
    useJUnitPlatform()
    // The tests check English texts, whatever the language of the machine is.
    systemProperty 'pdfixit.lang', 'en'
    // veraPDF checks many files in VerifiableRulesRepairTest.
    maxHeapSize = '2g'
}

javadoc.options.addStringOption('Xdoclint:none', '-quiet')
javadoc.options.addStringOption('stylesheetfile', 'doc/javadoc.css')

application {
    mainClass = 'com.bw.pdfixit.Main'
}

tasks.register('copyPngs', Copy) {
    from layout.projectDirectory.dir("doc")
    include("*.png")
    into layout.buildDirectory.dir("doc/doc")
}


tasks.register('copyDoc', Copy) {
    dependsOn(copyPngs)
    from(layout.projectDirectory) {
        include "README.adoc", "README.*.adoc"
    }
    into layout.buildDirectory.dir("doc")
}

pdfThemes {
    local 'basic', {
        themeDir = file('src/docs/themes')
        themeName = 'basic'
    }
}


asciidoctorPdf {
    dependsOn(copyDoc)
    // A changed theme or font creates the PDF again.
    inputs.dir('src/docs/themes')
    attributes 'pdf-themesdir': "${projectDir}/src/docs/themes",
            'pdf-theme': 'basic', // Matches 'custom-theme.yml'
            'pdf-fontsdir': "${projectDir}/src/docs/themes/fonts",
            'toc': 'macro',
            'toclevels': '2',
            'sectnums': '',
            'icons': 'font'

    asciidoctorj {
        options 'verbose': true
    }

    sourceDir  file('build/doc')
    sources {
        include 'README.adoc', 'README.*.adoc'
    }
    outputDir = file('build/doc/pdf')

}

// The README as PDF is the manual. It is not part of the jar but lies beside it (see Manual.java), in the
// distributions and when running with Gradle. asciidoctorPdf is only executed again if the README changed.
tasks.register('bundleManual', Copy) {
    dependsOn asciidoctorPdf
    // README.pdf is the English manual, README.de.pdf the German one (manual_de.pdf), and so on.
    from(layout.buildDirectory.dir('doc/pdf')) {
        include 'README*.pdf'
        rename 'README.pdf', 'manual.pdf'
        rename(/README\.(\w+)\.pdf/, 'manual_$1.pdf')
    }
    into layout.buildDirectory.dir('manual')
}

// The licenses of all libraries, generated by generateVersion.
def thirdPartyLicenses = layout.buildDirectory.file('licenses/THIRD-PARTY-LICENSES.txt')

tasks.matching { it.name in ['distZip', 'distTar', 'installDist'] }.configureEach { dependsOn 'generateVersion' }

distributions.main.contents {
    from(thirdPartyLicenses) {
        into 'lib'
    }
    from(tasks.named('bundleManual')) {
        into 'lib'
    }
}

tasks.named('run') {
    dependsOn 'bundleManual'
    systemProperty 'pdfixit.manual', layout.buildDirectory.file('manual/manual.pdf').get().asFile.absolutePath
}

tasks.register('cleanJreDir', Delete) {
    delete layout.buildDirectory.dir("jre").get()
}

tasks.register('jlink', Exec) {
    dependsOn cleanJreDir
    dependsOn build
    group = 'distribution'

    def imageDir = layout.buildDirectory.dir("jre").get()
    def modulePath = "${System.getProperty('java.home')}/jmods"

    // The jlink of the JDK that runs Gradle (it needs the matching jmods folder, which a plain JRE or some
    // runtime-only builds like the JetBrains Runtime don't have).
    def jlinkExe = new File(System.getProperty('java.home'), 'bin/jlink' + (org.gradle.internal.os.OperatingSystem.current().windows ? '.exe' : ''))
    doFirst {
        if (!jlinkExe.exists() || !new File(modulePath).isDirectory())
            throw new GradleException("The JDK ${System.getProperty('java.home')} has no jlink or jmods. Run Gradle with a full JDK.")
    }
    commandLine jlinkExe.absolutePath,
            '--module-path', modulePath,
            // jdeps result for the runtime classpath (Mustang needs XML, SQL and naming), plus logging for safety.
            '--add-modules', 'java.base,java.compiler,java.desktop,java.logging,java.management,java.naming,java.prefs,java.sql,java.xml,jdk.xml.dom',
            '--output', imageDir,
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
}

launch4j {
    mainClassName = 'com.bw.pdfixit.Main'
    outputDir = layout.buildDirectory.dir("launch4j").get().asFile.absolutePath
    outfile = "PDFixit.exe"
    icon = file('src/installer/icon.ico').absolutePath
    bundledJrePath = 'jre'
    // The bundled JRE is created by jlink from the JDK that runs the build, so it has no fixed version.
    // Only a lower limit: the byte code needs Java 17 (see options.release).
    jreMinVersion = '17'
    headerType = 'gui'
    requires64Bit = true
    copyConfigurable = configurations.runtimeClasspath
}

tasks.register('distZipWithJre', Zip) {
    group = "distribution"
    dependsOn(jlink)
    dependsOn(createExe)
    dependsOn(bundleManual)
    dependsOn(generateVersion)
    from('build/launch4j')
    from('build/jre') {
        into 'jre'
    }
    from('build/libs') {
        include '*.jar'
        into 'lib'
    }
    // The licenses of the libraries (MPL 2.0 of veraPDF asks to name the source) lie beside the jar.
    from(thirdPartyLicenses) {
        into 'lib'
    }
    // The manual lies beside the jar.
    from(tasks.named('bundleManual')) {
        into 'lib'
    }
    archiveFileName = "PDFixit-${project.version}-jre.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions").get()
}

// ---------------------------------------------------------------------------------------------------------------
// Windows installer (MSI) built by jpackage. It needs a JDK with WiX 4/5 support (JDK 24 or newer) and the WiX
// Toolset (the "wix" command must be on the PATH, with the extensions WixToolset.UI.wixext and
// WixToolset.Util.wixext). The JDK is the one that runs Gradle, or -PjpackageJdk=<JDK home> or JPACKAGE_JDK.
// The installer asks for the folder and whether to create shortcuts. The PDFs are not associated with the tool.
// Installs for all users and asks for administrator rights. -PmsiPerUser builds a per-user installer instead.
// ---------------------------------------------------------------------------------------------------------------

// Never change this GUID: it lets a newer installer replace the installed version.
def msiUpgradeUuid = '7f3c1a52-8d4e-4b6a-9c21-5e0b3d9a41f7'

def msiInputDir = layout.buildDirectory.dir('msi/input')

// The application jar, the libraries, the manual and the licenses. The manual is searched beside the jars.
tasks.register('msiInput', Sync) {
    dependsOn jar, bundleManual, generateVersion
    into msiInputDir
    from(jar)
    from(configurations.runtimeClasspath)
    from(tasks.named('bundleManual'))
    from(thirdPartyLicenses)
}

tasks.register('msi') {
    group = 'distribution'
    description = 'Creates the Windows installer (MSI) with jpackage.'
    dependsOn msiInput, jlink
    def distDir = layout.buildDirectory.dir('distributions')
    def workDir = layout.buildDirectory.dir('msi')
    def jreDir = layout.buildDirectory.dir('jre')
    def jarName = jar.archiveFileName
    def perUser = project.hasProperty('msiPerUser')
    // Default: the JDK that runs Gradle (JDK 24, see gradle/gradle-daemon-jvm.properties).
    def jdkHome = (project.findProperty('jpackageJdk') ?: System.getenv('JPACKAGE_JDK') ?: System.getProperty('java.home')).toString()
    def appVersion = project.version.toString().tokenize('.').with { (it + ['0', '0', '0']).take(3).join('.') }
    def iconFile = file('src/installer/icon.ico')
    def licenseFile = file('LICENSE')
    doLast {
        def jpackage = new File(jdkHome, 'bin/jpackage.exe')
        if (!jpackage.exists())
            throw new GradleException("jpackage not found: ${jpackage}")
        def work = workDir.get().asFile
        // The second launcher has a console, so the command line options show their output.
        def cli = new File(work, 'cli-launcher.properties')
        cli.text = 'win-console=true\n'
        def args = [jpackage.absolutePath,
                    '--type', 'msi',
                    '--name', 'PDFixit',
                    '--app-version', appVersion,
                    '--vendor', 'BWeng20',
                    '--description', 'PDFixit - PDF Workbench',
                    '--icon', iconFile.absolutePath,
                    '--license-file', licenseFile.absolutePath,
                    '--input', new File(work, 'input').absolutePath,
                    '--main-jar', jarName.get(),
                    '--main-class', 'com.bw.pdfixit.Main',
                    '--runtime-image', jreDir.get().asFile.absolutePath,
                    '--dest', distDir.get().asFile.absolutePath,
                    '--temp', new File(work, 'temp').absolutePath,
                    '--add-launcher', "PDFixit-cli=${cli.absolutePath}",
                    '--win-dir-chooser',
                    '--win-menu', '--win-menu-group', 'PDFixit',
                    '--win-shortcut', '--win-shortcut-prompt',
                    '--win-upgrade-uuid', msiUpgradeUuid]
        if (perUser)
            args << '--win-per-user-install'
        new File(work, 'temp').deleteDir()
        logger.lifecycle('jpackage {}', args.drop(1).join(' '))
        def proc = new ProcessBuilder(args.collect { it.toString() }).redirectErrorStream(true).start()
        proc.inputStream.eachLine { logger.lifecycle(it) }
        if (proc.waitFor() != 0)
            throw new GradleException('jpackage failed. Is WiX installed (command "wix" on the PATH)?')
    }
}
